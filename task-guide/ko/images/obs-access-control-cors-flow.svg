<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" width="600" height="390" font-family="'Pretendard', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">브라우저 페이지가 CORS 허용 출처를 등록한 Object Storage 컨테이너에 접근하는 흐름</title>
  <desc id="desc">페이지가 실행되는 브라우저와 Object Storage는 서로 다른 호스트이므로 요청은 다른 출처로 취급됩니다. 요청은 접근 정책이 PUBLIC이고 CORS 허용 출처를 등록한 컨테이너에 닿고, 돌아온 응답은 브라우저가 허용 출처인지 확인한 다음에야 스크립트에 전달됩니다.</desc>
  <rect width="600" height="390" fill="#F7F7F7"/>

  <!-- 브라우저 영역 -->
  <rect x="12" y="20" width="276" height="314" rx="8" fill="#FFFFFF"/>
  <g transform="translate(24, 30) scale(0.4)">
    <circle cx="29" cy="17" r="10" fill="#C8CCD4"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M50 50C50 37.2174 40.598 29 29 29C17.402 29 8 37.2174 8 50H50Z" fill="#C8CCD4"/>
  </g>
  <text x="52" y="42" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2D2D2D">브라우저</text>

  <!-- 페이지 노드 -->
  <rect x="24" y="64" width="252" height="60" rx="6" fill="#646464"/>
  <text x="150" y="84" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#FFFFFF">페이지 (https://app.example.com)</text>
  <text x="150" y="104" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">스크립트가 fetch()로 오브젝트를 요청</text>

  <!-- CORS 확인 -->
  <rect x="24" y="190" width="140" height="60" rx="6" fill="none" stroke="#125DE6" stroke-width="1.5"/>
  <text x="94" y="210" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#125DE6">CORS 확인</text>
  <text x="94" y="230" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B8B8B">허용 출처인가</text>

  <!-- 3 통과하면 응답을 읽음 -->
  <path d="M 94 190 L 94 131" fill="none" stroke="#125DE6" stroke-width="1.5"/>
  <polygon points="94,124 98,132 90,132" fill="#125DE6"/>
  <circle cx="114" cy="157" r="9" fill="#2D2D2D"/>
  <text x="114" y="157" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="127" y="157" dominant-baseline="central" font-size="12" fill="#444444">통과하면 응답을 읽음</text>

  <!-- 차단 -->
  <rect x="196" y="198" width="80" height="44" rx="6" fill="#F7F7F7"/>
  <text x="236" y="212" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2D2D2D">차단</text>
  <text x="236" y="229" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B8B8B">TypeError</text>
  <path d="M 164 220 L 189 220" fill="none" stroke="#D94141" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="196,220 188,224 188,216" fill="#D94141"/>

  <!-- NHN Cloud 영역 -->
  <rect x="304" y="20" width="284" height="314" rx="8" fill="#E7F2FF"/>
  <text x="320" y="42" dominant-baseline="central" font-size="14" font-weight="bold" fill="#125DE6">NHN Cloud</text>

  <!-- Object Storage -->
  <rect x="314" y="60" width="264" height="226" rx="8" fill="#FFFFFF"/>
  <g transform="translate(324, 70) scale(0.5)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M14 8C14 6.89543 14.8954 6 16 6H32C33.1046 6 34 6.89543 34 8V24C34 25.1046 33.1046 26 32 26H30V12C30 10.8954 29.1046 10 28 10H14V8Z" fill="#125DE6"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 14C6.89543 14 6 14.8954 6 16V32C6 33.1046 6.89543 34 8 34H24C25.1046 34 26 33.1046 26 32V16C26 14.8954 25.1046 14 24 14H8Z" fill="#125DE6"/>
  </g>
  <text x="352" y="81" dominant-baseline="central" font-size="14" font-weight="bold" fill="#125DE6">Object Storage</text>
  <text x="326" y="101" dominant-baseline="central" font-size="11" fill="#8B8B8B">kr1-api-object-storage.nhncloudservice.com</text>

  <!-- 컨테이너 노드 -->
  <rect x="326" y="192" width="240" height="76" rx="6" fill="#125DE6"/>
  <text x="446" y="211" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#FFFFFF">컨테이너</text>
  <text x="446" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">접근 정책 PUBLIC</text>
  <text x="446" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">CORS 허용 출처 등록</text>

  <!-- 1 요청 -->
  <path d="M 276 116 L 446 116 L 446 185" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="446,192 442,184 450,184" fill="#8B8B8B"/>
  <circle cx="464" cy="152" r="9" fill="#2D2D2D"/>
  <text x="464" y="152" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="477" y="152" dominant-baseline="central" font-size="12" fill="#444444">요청</text>

  <!-- 2 응답 -->
  <path d="M 446 268 L 446 310 L 94 310 L 94 257" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="94,250 98,258 90,258" fill="#8B8B8B"/>
  <circle cx="114" cy="295" r="9" fill="#2D2D2D"/>
  <text x="114" y="295" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="127" y="295" dominant-baseline="central" font-size="12" fill="#444444">응답 (200 OK)</text>

  <!-- 범례 -->
  <line x1="12" y1="352" x2="588" y2="352" stroke="#DCDCDC" stroke-width="1"/>
  <path d="M 12 370 L 33 370" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="40,370 32,374 32,366" fill="#8B8B8B"/>
  <text x="48" y="370" dominant-baseline="central" font-size="11" fill="#2D2D2D">요청·응답</text>
  <path d="M 128 370 L 149 370" fill="none" stroke="#125DE6" stroke-width="1.5"/>
  <polygon points="156,370 148,374 148,366" fill="#125DE6"/>
  <text x="164" y="370" dominant-baseline="central" font-size="11" fill="#2D2D2D">통과</text>
  <path d="M 214 370 L 235 370" fill="none" stroke="#D94141" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="242,370 234,374 234,366" fill="#D94141"/>
  <text x="250" y="370" dominant-baseline="central" font-size="11" fill="#2D2D2D">차단</text>
</svg>
