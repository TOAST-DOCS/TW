<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 342" width="600" height="342" font-family="'Pretendard', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">인스턴스를 중지하고 이미지를 생성한 뒤 그 이미지로 새 인스턴스를 생성하는 구성</title>
  <desc id="desc">원본 인스턴스에 연결된 루트 블록 스토리지를 복사해 개인 이미지를 생성하고, 그 개인 이미지로 새 인스턴스의 루트 블록 스토리지를 생성해 원본과 같은 구성의 인스턴스를 만듭니다. 루트 블록 스토리지는 인스턴스에 포함되지만 인스턴스에 연결된 별도 리소스입니다.</desc>
  <rect width="600" height="342" fill="#F7F7F7"/>

  <!-- NHN Cloud 영역 -->
  <rect x="8" y="20" width="584" height="302" rx="8" fill="#E7F2FF"/>
  <text x="24" y="42" dominant-baseline="central" font-size="14" font-weight="bold" fill="#125DE6">NHN Cloud</text>

  <!-- Instance(원본) -->
  <rect x="16" y="60" width="146" height="246" rx="8" fill="#FFFFFF"/>
  <g transform="translate(26, 71) scale(0.5)">
    <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
  </g>
  <text x="54" y="82" dominant-baseline="central" font-size="14" font-weight="bold" fill="#125DE6">Instance</text>
  <rect x="24" y="100" width="130" height="196" rx="6" fill="#646464"/>
  <text x="89" y="118" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#FFFFFF">원본 인스턴스</text>
  <text x="89" y="137" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">중지한 상태에서</text>
  <text x="89" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">이미지 생성</text>
  <rect x="29" y="168" width="120" height="120" rx="6" fill="#125DE6"/>
  <text x="89" y="184" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#FFFFFF">루트 블록 스토리지</text>
  <text x="89" y="204" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">운영체제와</text>
  <text x="89" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">애플리케이션이</text>
  <text x="89" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">설치된 디스크</text>
  <text x="89" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">인스턴스에 연결된</text>
  <text x="89" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">별도 리소스</text>

  <!-- Image -->
  <rect x="227" y="60" width="146" height="246" rx="8" fill="#FFFFFF"/>
  <g transform="translate(237, 71) scale(0.5)">
    <path d="M14 10H10V30H14V34H6V6H14V10ZM34 34H26V30H30V10H26V6H34V34ZM26 26H22V22H26V26ZM18 26H14V22H18V26ZM26 18H22V14H26V18ZM18 18H14V14H18V18Z" fill="#125DE6"/>
  </g>
  <text x="265" y="82" dominant-baseline="central" font-size="14" font-weight="bold" fill="#125DE6">Image</text>
  <rect x="235" y="188" width="130" height="80" rx="6" fill="#125DE6"/>
  <text x="300" y="208" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#FFFFFF">개인 이미지</text>
  <text x="300" y="229" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">루트 블록</text>
  <text x="300" y="245" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">스토리지의 복사본</text>

  <!-- Instance(새) -->
  <rect x="438" y="60" width="146" height="246" rx="8" fill="#FFFFFF"/>
  <g transform="translate(448, 71) scale(0.5)">
    <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
  </g>
  <text x="476" y="82" dominant-baseline="central" font-size="14" font-weight="bold" fill="#125DE6">Instance</text>
  <rect x="446" y="100" width="130" height="196" rx="6" fill="#646464"/>
  <text x="511" y="118" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#FFFFFF">새 인스턴스</text>
  <text x="511" y="137" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">원본과 같은</text>
  <text x="511" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">구성으로 복제</text>
  <rect x="451" y="168" width="120" height="120" rx="6" fill="#125DE6"/>
  <text x="511" y="184" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#FFFFFF">루트 블록 스토리지</text>
  <text x="511" y="204" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">이미지로</text>
  <text x="511" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">생성한 디스크</text>
  <text x="511" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">원본과 같은 내용</text>
  <text x="511" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">인스턴스에 연결된</text>
  <text x="511" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">별도 리소스</text>

  <!-- 1 루트 블록 스토리지 → 개인 이미지 -->
  <path d="M 149 228 L 228 228" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="235,228 227,232 227,224" fill="#8B8B8B"/>
  <circle cx="195" cy="194" r="9" fill="#2D2D2D"/>
  <text x="195" y="194" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="195" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">이미지 생성</text>

  <!-- 2 개인 이미지 → 새 인스턴스의 루트 블록 스토리지 -->
  <path d="M 365 228 L 444 228" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="451,228 443,232 443,224" fill="#8B8B8B"/>
  <circle cx="406" cy="194" r="9" fill="#2D2D2D"/>
  <text x="406" y="194" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="406" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">인스턴스 생성</text>
</svg>
