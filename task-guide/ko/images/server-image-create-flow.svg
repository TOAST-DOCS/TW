<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">인스턴스를 중지하고 이미지를 생성한 뒤 그 이미지로 새 인스턴스를 생성하는 구성</title>
  <desc id="desc">프로젝트 안에서 원본 인스턴스를 중지한 상태로 이미지를 생성하면 루트 블록 스토리지가 개인 이미지에 담기고, 그 개인 이미지로 원본과 같은 구성의 새 인스턴스를 생성합니다.</desc>

  <defs>
    <style>
      .lbl  { font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
      .grp  { font-size: 14px; font-weight: 700; fill: #222222; }
      .svc  { font-size: 14px; font-weight: 700; fill: #222222; }
      .nod  { font-size: 15px; font-weight: 700; fill: #222222; }
      .sub  { font-size: 11.5px; fill: #555555; }
      .edge { font-size: 12.5px; fill: #555555; }
    </style>
    <marker id="ar-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <marker id="ar-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#FFFFFF"/>

  <!-- 그룹: NHN Cloud -->
  <rect x="40" y="40" width="880" height="400" fill="none" stroke="#111111" stroke-width="1.5"/>
  <g transform="translate(52,52) scale(0.75)">
    <rect width="32" height="32" fill="#111111"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M7 16.0918C7 13.1559 7.94325 10.7445 9.83004 8.85719C11.7422 6.94364 14.0367 6 16.7393 6C20.1303 6 23.1897 7.599 24.847 10.0105L22.3229 12.5531C20.8441 10.6919 19.0595 9.74845 16.9433 9.74845C15.2351 9.74845 13.8073 10.3513 12.6599 11.5571C11.5126 12.7366 10.9263 14.2569 10.9263 16.0918C10.9263 17.8742 11.4871 19.3421 12.6345 20.5215C13.7819 21.7012 15.2096 22.2778 16.9179 22.2778C19.1105 22.2778 20.9462 21.3342 22.3994 19.4469L25 21.8846C23.2663 24.3224 20.1813 26 16.6882 26C13.9602 26 11.6401 25.0826 9.77896 23.2477C7.91785 21.3867 7 19.0013 7 16.0918Z" fill="white"/>
  </g>
  <text class="lbl grp" x="88" y="70">NHN Cloud</text>

  <!-- 그룹: 프로젝트 -->
  <rect x="70" y="88" width="820" height="328" fill="none" stroke="#555555" stroke-width="1.5"/>
  <g transform="translate(82,100) scale(0.75)">
    <rect width="32" height="32" fill="#555555"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M6 5C5.44772 5 5 5.44772 5 6V26C5 26.5523 5.44772 27 6 27H26C26.5523 27 27 26.5523 27 26V6C27 5.44772 26.5523 5 26 5H6ZM25 10H7V25H25V10ZM18.7273 22H12.8125C11.2592 22 10 20.7408 10 19.1875C10 17.6627 11.2134 16.4213 12.7273 16.3763C12.7273 16.3758 12.7273 16.3754 12.7273 16.375C12.7273 14.511 14.1925 13 16 13C17.4325 13 18.6501 13.9492 19.0936 15.2709C20.7286 15.4587 22 16.8887 22 18.625C22 20.3942 20.6799 21.8455 19 21.9884V22H18.7273Z" fill="white"/>
  </g>
  <text class="lbl grp" x="118" y="118">프로젝트</text>

  <!-- 서비스: Instance (원본) -->
  <g transform="translate(110,140) scale(0.6)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 9C10.3431 9 9 10.3431 9 12V24C9 25.6569 10.3431 27 12 27H48C49.6569 27 51 25.6569 51 24V12C51 10.3431 49.6569 9 48 9H12ZM33 15V21H45V15H33Z" fill="#125DE6"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 33C10.3431 33 9 34.3431 9 36V48C9 49.6569 10.3431 51 12 51H48C49.6569 51 51 49.6569 51 48V36C51 34.3431 49.6569 33 48 33H12ZM33 39V45H45V39H33Z" fill="#125DE6"/>
  </g>
  <text class="lbl svc" x="150" y="163">Instance</text>

  <!-- 노드: 원본 인스턴스 -->
  <rect x="110" y="196" width="180" height="80" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
  <text class="lbl nod" x="200" y="228" text-anchor="middle">원본 인스턴스</text>
  <text class="lbl sub" x="200" y="249" text-anchor="middle">중지한 상태에서</text>
  <text class="lbl sub" x="200" y="265" text-anchor="middle">이미지 생성</text>

  <!-- 노드: 루트 블록 스토리지 -->
  <rect x="110" y="316" width="180" height="80" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
  <text class="lbl nod" x="200" y="348" text-anchor="middle">루트 블록 스토리지</text>
  <text class="lbl sub" x="200" y="369" text-anchor="middle">운영체제와 애플리케이션이</text>
  <text class="lbl sub" x="200" y="385" text-anchor="middle">설치된 디스크</text>

  <!-- 서비스: Image -->
  <g transform="translate(390,140) scale(0.6)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M9 51V9H21V15H15V45H21V51H9Z" fill="#125DE6"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M21 21V27H27V21H21Z" fill="#125DE6"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M21 33V39H27V33H21Z" fill="#125DE6"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M33 21V27H39V21H33Z" fill="#125DE6"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M33 33V39H39V33H33Z" fill="#125DE6"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M51 51V9H39V15H45V45H39V51H51Z" fill="#125DE6"/>
  </g>
  <text class="lbl svc" x="430" y="163">Image</text>

  <!-- 노드: 개인 이미지 -->
  <rect x="390" y="196" width="180" height="80" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
  <text class="lbl nod" x="480" y="228" text-anchor="middle">개인 이미지</text>
  <text class="lbl sub" x="480" y="249" text-anchor="middle">루트 블록 스토리지를</text>
  <text class="lbl sub" x="480" y="265" text-anchor="middle">담은 이미지</text>

  <!-- 서비스: Instance (새) -->
  <g transform="translate(670,140) scale(0.6)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 9C10.3431 9 9 10.3431 9 12V24C9 25.6569 10.3431 27 12 27H48C49.6569 27 51 25.6569 51 24V12C51 10.3431 49.6569 9 48 9H12ZM33 15V21H45V15H33Z" fill="#125DE6"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 33C10.3431 33 9 34.3431 9 36V48C9 49.6569 10.3431 51 12 51H48C49.6569 51 51 49.6569 51 48V36C51 34.3431 49.6569 33 48 33H12ZM33 39V45H45V39H33Z" fill="#125DE6"/>
  </g>
  <text class="lbl svc" x="710" y="163">Instance</text>

  <!-- 노드: 새 인스턴스 -->
  <rect x="670" y="196" width="180" height="80" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
  <text class="lbl nod" x="760" y="228" text-anchor="middle">새 인스턴스</text>
  <text class="lbl sub" x="760" y="249" text-anchor="middle">원본과 같은 구성으로</text>
  <text class="lbl sub" x="760" y="265" text-anchor="middle">복제된 인스턴스</text>

  <!-- ① 이미지 생성 (주 경로) -->
  <line x1="296" y1="236" x2="384" y2="236" stroke="#555555" stroke-width="1.5" marker-end="url(#ar-primary)"/>
  <text class="lbl edge" x="340" y="227" text-anchor="middle">① 이미지 생성</text>

  <!-- ② 인스턴스 생성 (주 경로) -->
  <line x1="576" y1="236" x2="664" y2="236" stroke="#555555" stroke-width="1.5" marker-end="url(#ar-primary)"/>
  <text class="lbl edge" x="620" y="227" text-anchor="middle">② 인스턴스 생성</text>

  <!-- 보조 경로: 루트 블록 스토리지가 이미지에 담김 -->
  <polyline points="296,356 480,356 480,282" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar-secondary)"/>
  <text class="lbl edge" x="388" y="347" text-anchor="middle">이미지에 담김</text>
</svg>
