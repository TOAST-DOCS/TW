<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="'Pretendard', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">인스턴스를 중지하고 이미지를 생성한 뒤 그 이미지로 새 인스턴스를 생성하는 구성</title>
  <desc id="desc">원본 인스턴스에 연결된 루트 블록 스토리지를 복사해 개인 이미지를 생성하고, 그 개인 이미지로 새 인스턴스의 루트 블록 스토리지를 생성해 원본과 같은 구성의 인스턴스를 만듭니다. 루트 블록 스토리지는 인스턴스에 포함되지만 인스턴스에 연결된 별도 리소스입니다.</desc>
  <rect width="960" height="390" rx="12" fill="#F7F7F7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B8B8B"/>
    </marker>
  </defs>

  <!-- ===== NHN Cloud 영역 ===== -->
  <rect x="40" y="40" width="880" height="310" rx="8" fill="#E7F2FF"/>
  <text x="56" y="62" fill="#125DE6" font-size="13" font-weight="700">NHN Cloud</text>

  <!-- ===== Instance (원본) 컨테이너 ===== -->
  <rect x="70" y="84" width="220" height="246" rx="8" fill="#FFFFFF"/>
  <g transform="translate(84, 94) scale(0.5)">
    <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
  </g>
  <text x="110" y="109" fill="#125DE6" font-size="13" font-weight="700">Instance</text>

  <!-- 원본 인스턴스 노드 (x=85..275) -->
  <rect x="85" y="130" width="190" height="180" rx="6" fill="#125DE6"/>
  <text x="180" y="155" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">원본 인스턴스</text>
  <text x="180" y="174" text-anchor="middle" fill="#FFFFFF" font-size="10">중지한 상태에서 이미지 생성</text>

  <!-- 루트 블록 스토리지 (인스턴스 안의 하위 항목, cy=240) -->
  <rect x="97" y="190" width="166" height="100" rx="6" fill="#F7F7F7"/>
  <text x="180" y="216" text-anchor="middle" fill="#2D2D2D" font-size="12" font-weight="600">루트 블록 스토리지</text>
  <text x="180" y="236" text-anchor="middle" fill="#8B8B8B" font-size="10">운영체제와 애플리케이션이</text>
  <text x="180" y="251" text-anchor="middle" fill="#8B8B8B" font-size="10">설치된 디스크</text>
  <text x="180" y="272" text-anchor="middle" fill="#8B8B8B" font-size="10">인스턴스에 연결된 별도 리소스</text>

  <!-- ===== Image 컨테이너 ===== -->
  <rect x="370" y="84" width="220" height="246" rx="8" fill="#FFFFFF"/>
  <g transform="translate(384, 94) scale(0.5)">
    <path d="M14 10H10V30H14V34H6V6H14V10ZM34 34H26V30H30V10H26V6H34V34ZM26 26H22V22H26V26ZM18 26H14V22H18V26ZM26 18H22V14H26V18ZM18 18H14V14H18V18Z" fill="#125DE6"/>
  </g>
  <text x="410" y="109" fill="#125DE6" font-size="13" font-weight="700">Image</text>

  <!-- 개인 이미지 노드 (cx=480, cy=240) -->
  <rect x="385" y="205" width="190" height="70" rx="6" fill="#125DE6"/>
  <text x="480" y="233" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">개인 이미지</text>
  <text x="480" y="253" text-anchor="middle" fill="#FFFFFF" font-size="10">루트 블록 스토리지의 복사본</text>

  <!-- ===== Instance (새) 컨테이너 ===== -->
  <rect x="670" y="84" width="220" height="246" rx="8" fill="#FFFFFF"/>
  <g transform="translate(684, 94) scale(0.5)">
    <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
  </g>
  <text x="710" y="109" fill="#125DE6" font-size="13" font-weight="700">Instance</text>

  <!-- 새 인스턴스 노드 (x=685..875) -->
  <rect x="685" y="130" width="190" height="180" rx="6" fill="#125DE6"/>
  <text x="780" y="155" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">새 인스턴스</text>
  <text x="780" y="174" text-anchor="middle" fill="#FFFFFF" font-size="10">원본과 같은 구성으로 복제</text>

  <!-- 루트 블록 스토리지 (새 인스턴스 안의 하위 항목, cy=240) -->
  <rect x="697" y="190" width="166" height="100" rx="6" fill="#F7F7F7"/>
  <text x="780" y="216" text-anchor="middle" fill="#2D2D2D" font-size="12" font-weight="600">루트 블록 스토리지</text>
  <text x="780" y="236" text-anchor="middle" fill="#8B8B8B" font-size="10">이미지로 생성한 디스크</text>
  <text x="780" y="251" text-anchor="middle" fill="#8B8B8B" font-size="10">원본과 같은 내용</text>
  <text x="780" y="272" text-anchor="middle" fill="#8B8B8B" font-size="10">인스턴스에 연결된 별도 리소스</text>

  <!-- ===== ① 루트 블록 스토리지 → 개인 이미지: 이미지 생성 (실선) ===== -->
  <line x1="263" y1="240" x2="383" y2="240" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="283" y="214" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="292" y="227" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1</text>
  <text x="305" y="227" fill="#444444" font-size="11">이미지 생성</text>

  <!-- ===== ② 개인 이미지 → 새 인스턴스의 루트 블록 스토리지: 인스턴스 생성 (실선) ===== -->
  <line x1="575" y1="240" x2="695" y2="240" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="590" y="214" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="599" y="227" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">2</text>
  <text x="612" y="227" fill="#444444" font-size="11">인스턴스 생성</text>
</svg>
