<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'Pretendard', sans-serif" role="img">
  <title>게스트 계정을 Google 계정에 매핑하는 흐름</title>
  <desc>게스트로 로그인한 상태에서 AddMapping을 호출합니다. Google 계정이 다른 계정에 매핑되어 있지 않으면 매핑에 성공하고 게스트 userId가 유지됩니다. 이미 다른 계정에 매핑되어 있으면 AUTH_ADD_MAPPING_ALREADY_MAPPED_TO_OTHER_MEMBER 오류와 함께 ForcingMappingTicket을 얻고, AddMappingForcibly로 강제 매핑하거나, ChangeLogin으로 로그인을 전환하거나, 아무것도 호출하지 않고 게스트 상태를 유지합니다.</desc>
  <defs>
    <marker id="arrow-default" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8B8B8B"/>
    </marker>
  </defs>

  <rect width="600" height="600" fill="#F7F7F7"/>

  <!-- 게스트 로그인 상태 -->
  <rect x="140" y="30" width="200" height="44" rx="6" fill="#646464"/>
  <text x="240" y="52" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">게스트로 로그인한 상태</text>

  <line x1="240" y1="74" x2="240" y2="104" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>

  <!-- AddMapping 호출 -->
  <rect x="140" y="104" width="200" height="44" rx="6" fill="#125DE6"/>
  <text x="240" y="126" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">AddMapping 호출</text>

  <line x1="240" y1="148" x2="240" y2="178" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>

  <!-- 판단 -->
  <polygon points="240,178 370,238 240,298 110,238" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
  <text x="240" y="230" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">이미 다른 계정에 매핑된</text>
  <text x="240" y="246" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">Google 계정인가요?</text>

  <!-- 아니오 → 매핑 성공 -->
  <line x1="370" y1="238" x2="420" y2="238" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <text x="395" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">아니오</text>
  <rect x="420" y="210" width="150" height="56" rx="6" fill="#646464"/>
  <text x="495" y="230" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">매핑 성공</text>
  <text x="495" y="246" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">게스트 userId 유지</text>

  <!-- 예 → 오류 + 티켓 -->
  <line x1="240" y1="298" x2="240" y2="338" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <text x="252" y="318" dominant-baseline="central" font-size="12" fill="#444444">예</text>
  <rect x="25" y="338" width="430" height="56" rx="6" fill="#646464"/>
  <text x="240" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">AUTH_ADD_MAPPING_ALREADY_MAPPED_TO_OTHER_MEMBER (3302)</text>
  <text x="240" y="374" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">ForcingMappingTicket 획득</text>

  <!-- 세 갈래 분기 -->
  <line x1="240" y1="394" x2="240" y2="414" stroke="#8B8B8B" stroke-width="1.5"/>
  <line x1="105" y1="414" x2="495" y2="414" stroke="#8B8B8B" stroke-width="1.5"/>
  <line x1="105" y1="414" x2="105" y2="444" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <line x1="300" y1="414" x2="300" y2="444" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <line x1="495" y1="414" x2="495" y2="444" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>

  <rect x="20" y="444" width="170" height="56" rx="6" fill="#125DE6"/>
  <text x="105" y="464" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">강제 매핑</text>
  <text x="105" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">AddMappingForcibly 호출</text>

  <rect x="215" y="444" width="170" height="56" rx="6" fill="#125DE6"/>
  <text x="300" y="464" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">로그인 전환</text>
  <text x="300" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">ChangeLogin 호출</text>

  <rect x="410" y="444" width="170" height="56" rx="6" fill="#646464"/>
  <text x="495" y="464" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">매핑 포기</text>
  <text x="495" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">게스트 상태 유지</text>

  <!-- 범례 -->
  <line x1="20" y1="530" x2="580" y2="530" stroke="#DCDCDC" stroke-width="1"/>
  <rect x="140" y="552" width="20" height="14" rx="3" fill="#646464"/>
  <text x="166" y="559" dominant-baseline="central" font-size="11" fill="#444444">상태·결과</text>
  <rect x="250" y="552" width="20" height="14" rx="3" fill="#125DE6"/>
  <text x="276" y="559" dominant-baseline="central" font-size="11" fill="#444444">API 호출</text>
  <polygon points="370,552 380,559 370,566 360,559" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.2"/>
  <text x="388" y="559" dominant-baseline="central" font-size="11" fill="#444444">판단</text>
</svg>
