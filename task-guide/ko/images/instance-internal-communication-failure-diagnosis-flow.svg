<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Pretendard', sans-serif">
  <rect width="960" height="660" rx="12" fill="#F7F7F7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B8B8B"/>
    </marker>
  </defs>

  <g transform="translate(-35, 4)">

    <!-- ===== Start: 증상 ===== -->
    <rect x="120" y="20" width="260" height="36" rx="6" fill="#003087"/>
    <text x="250" y="43" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">같은 VPC 내 인스턴스 간 통신 안 됨</text>

    <!-- Start → Q1 -->
    <line x1="250" y1="56" x2="250" y2="88" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- ===== Q1: 보안 그룹 규칙 확인 ===== -->
    <rect x="100" y="90" width="300" height="56" rx="6" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
    <text x="250" y="114" text-anchor="middle" fill="#125DE6" font-size="12" font-weight="600">보안 그룹 규칙에</text>
    <text x="250" y="132" text-anchor="middle" fill="#125DE6" font-size="12" font-weight="600">방향·프로토콜·포트·IP가 맞는가?</text>

    <!-- Q1 → F1 (아니오) -->
    <line x1="400" y1="118" x2="538" y2="118" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="454" y="110" fill="#444444" font-size="11">아니오</text>

    <!-- F1: 규칙 수정 -->
    <rect x="540" y="100" width="200" height="36" rx="6" fill="#125DE6"/>
    <text x="640" y="123" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">규칙 수정 (원인 1)</text>

    <!-- Q1 → Q2 (예) -->
    <line x1="250" y1="146" x2="250" y2="194" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="262" y="174" fill="#444444" font-size="11">예</text>

    <!-- ===== Q2: 서브넷 확인 ===== -->
    <rect x="140" y="196" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
    <text x="250" y="220" text-anchor="middle" fill="#125DE6" font-size="12" font-weight="600">서브넷이 다른가?</text>

    <!-- Q2 → Q2a (예, 오른쪽으로 분기 후 아래로) -->
    <path d="M360,215 H530 V288" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="370" y="208" fill="#444444" font-size="11">예</text>

    <!-- Q2 → Q3 (아니오, 수직 하강) -->
    <line x1="250" y1="234" x2="250" y2="394" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="212" y="262" fill="#444444" font-size="11">아니오</text>

    <!-- ===== Q2a: 라우팅 확인 ===== -->
    <rect x="400" y="290" width="260" height="52" rx="6" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
    <text x="530" y="312" text-anchor="middle" fill="#125DE6" font-size="12" font-weight="600">라우팅 테이블에</text>
    <text x="530" y="330" text-anchor="middle" fill="#125DE6" font-size="12" font-weight="600">대상 서브넷 경로가 있는가?</text>

    <!-- Q2a → F2 (아니오) -->
    <line x1="660" y1="316" x2="718" y2="316" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="670" y="308" fill="#444444" font-size="11">아니오</text>

    <!-- F2: 라우팅 경로 추가 -->
    <rect x="720" y="298" width="210" height="36" rx="6" fill="#125DE6"/>
    <text x="825" y="321" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">라우팅 경로 추가 (원인 2)</text>

    <!-- Q2a → Q3 (예, 아래로 내려가 메인 라인에 합류) -->
    <path d="M530,342 V372 H250" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
    <text x="540" y="362" fill="#444444" font-size="11">예</text>

    <!-- ===== Q3: OS 방화벽 확인 ===== -->
    <rect x="120" y="396" width="260" height="52" rx="6" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
    <text x="250" y="418" text-anchor="middle" fill="#125DE6" font-size="12" font-weight="600">OS 방화벽에서</text>
    <text x="250" y="436" text-anchor="middle" fill="#125DE6" font-size="12" font-weight="600">해당 포트를 차단하는가?</text>

    <!-- Q3 → F3 (예) -->
    <line x1="380" y1="422" x2="528" y2="422" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="438" y="414" fill="#444444" font-size="11">예</text>

    <!-- F3: OS 방화벽 규칙 추가 -->
    <rect x="530" y="404" width="250" height="36" rx="6" fill="#125DE6"/>
    <text x="655" y="427" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">OS 방화벽 규칙 추가 (원인 3)</text>

    <!-- Q3 → Q4 (아니오) -->
    <line x1="250" y1="448" x2="250" y2="494" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="262" y="476" fill="#444444" font-size="11">아니오</text>

    <!-- ===== Q4: 다른 인스턴스 확인 ===== -->
    <rect x="105" y="496" width="290" height="52" rx="6" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
    <text x="250" y="518" text-anchor="middle" fill="#125DE6" font-size="12" font-weight="600">같은 서브넷의 다른 인스턴스는</text>
    <text x="250" y="536" text-anchor="middle" fill="#125DE6" font-size="12" font-weight="600">통신되는가?</text>

    <!-- Q4 → F4 (예) -->
    <line x1="395" y1="522" x2="528" y2="522" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="446" y="514" fill="#444444" font-size="11">예</text>

    <!-- F4: 특정 인스턴스 문제 -->
    <rect x="530" y="504" width="270" height="36" rx="6" fill="#125DE6"/>
    <text x="665" y="527" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">특정 인스턴스 문제 의심 (원인 4)</text>

    <!-- Q4 → F5 (아니오) -->
    <line x1="250" y1="548" x2="250" y2="594" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="262" y="576" fill="#444444" font-size="11">아니오</text>

    <!-- ===== F5: 고객지원 문의 ===== -->
    <rect x="170" y="596" width="160" height="36" rx="6" fill="#646464"/>
    <text x="250" y="619" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">고객지원 문의</text>

  </g>
</svg>