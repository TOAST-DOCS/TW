<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" width="600" height="820" font-family="'Pretendard', sans-serif" role="img">
  <title>Gamebase 미소비 결제 건 조회·재처리 흐름</title>
  <desc>앱 실행 또는 운영 도구에서 미소비 결제 목록을 조회합니다(1). 미소비 건이 없으면 처리가 필요 없고, 있으면 각 건을 순회합니다. paymentSeq가 게임 DB에 이미 있으면 이미 지급된 건이므로 바로 Consume API를 호출하고, 없으면 Get Payment Transaction으로 결제 내역을 검증한 뒤 아이템을 지급하고 DB에 기록합니다(2). 이어서 Consume API를 호출해 소비 처리를 완료합니다(3). 모든 건을 처리한 뒤 미소비 목록을 재조회해 확인합니다.</desc>
  <defs>
    <marker id="arrow-default" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8B8B8B"/>
    </marker>
  </defs>

  <rect width="600" height="820" fill="#F7F7F7"/>

  <!-- 콘텐츠 x 60~570 → translate(-15)로 좌우 여백 45 균등 -->
  <g transform="translate(-15, 0)">

    <!-- 시작 -->
    <rect x="150" y="30" width="220" height="40" rx="6" fill="#646464"/>
    <text x="260" y="50" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">앱 실행 또는 운영 도구</text>
    <line x1="260" y1="70" x2="260" y2="96" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>

    <!-- ① 미소비 목록 조회 -->
    <circle cx="132" cy="118" r="9" fill="#2D2D2D"/>
    <text x="132" y="118" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">1</text>
    <rect x="150" y="96" width="220" height="44" rx="6" fill="#125DE6"/>
    <text x="260" y="118" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">미소비 결제 목록 조회</text>
    <line x1="260" y1="140" x2="260" y2="166" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>

    <!-- 판단 1 -->
    <polygon points="260,166 370,214 260,262 150,214" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
    <text x="260" y="206" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">미소비 건이</text>
    <text x="260" y="222" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">있는가?</text>
    <line x1="370" y1="214" x2="430" y2="214" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
    <text x="400" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#444444">아니오</text>
    <rect x="430" y="194" width="140" height="40" rx="6" fill="#646464"/>
    <text x="500" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">처리 불필요</text>
    <line x1="260" y1="262" x2="260" y2="296" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
    <text x="272" y="284" font-size="12" font-weight="bold" fill="#444444">예</text>

    <!-- 각 건 순회 (반복 구간: 외곽선 노드) -->
    <rect x="150" y="296" width="220" height="40" rx="6" fill="none" stroke="#125DE6" stroke-width="1.5"/>
    <text x="260" y="316" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#125DE6">각 미소비 건 순회</text>
    <line x1="260" y1="336" x2="260" y2="362" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>

    <!-- 판단 2 -->
    <polygon points="260,362 370,410 260,458 150,410" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
    <text x="260" y="402" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">paymentSeq가</text>
    <text x="260" y="418" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">DB에 있는가?</text>
    <!-- 예: 이미 지급 → Consume API 호출로 바로 이동 -->
    <path d="M370 410 L500 410 L500 652 L370 652" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
    <text x="435" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#444444">예</text>
    <text x="512" y="531" dominant-baseline="central" font-size="12" fill="#444444">이미 지급</text>
    <line x1="260" y1="458" x2="260" y2="492" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
    <text x="272" y="480" font-size="12" font-weight="bold" fill="#444444">아니오</text>

    <!-- ② 결제 내역 검증 -->
    <circle cx="132" cy="516" r="9" fill="#2D2D2D"/>
    <text x="132" y="516" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">2</text>
    <rect x="150" y="492" width="220" height="48" rx="6" fill="#125DE6"/>
    <text x="260" y="508" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">결제 내역 검증</text>
    <text x="260" y="524" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">Get Payment Transaction</text>
    <line x1="260" y1="540" x2="260" y2="566" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>

    <!-- 아이템 지급·DB 기록 -->
    <rect x="150" y="566" width="220" height="40" rx="6" fill="#125DE6"/>
    <text x="260" y="586" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">아이템 지급·DB 기록</text>
    <line x1="260" y1="606" x2="260" y2="632" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>

    <!-- ③ Consume API 호출 -->
    <circle cx="132" cy="644" r="9" fill="#2D2D2D"/>
    <text x="132" y="644" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">3</text>
    <rect x="150" y="632" width="220" height="40" rx="6" fill="#125DE6"/>
    <text x="260" y="652" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">Consume API 호출</text>

    <!-- 다음 건으로 반복 -->
    <path d="M150 664 L60 664 L60 316 L150 316" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
    <text x="68" y="440" dominant-baseline="central" font-size="12" fill="#444444">다음 건</text>

    <!-- 종료 -->
    <line x1="260" y1="672" x2="260" y2="712" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
    <text x="272" y="696" font-size="12" font-weight="bold" fill="#444444">전부 처리</text>
    <rect x="150" y="712" width="220" height="40" rx="6" fill="#646464"/>
    <text x="260" y="732" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">미소비 목록 재조회로 확인</text>

    <!-- 범례 -->
    <line x1="60" y1="772" x2="570" y2="772" stroke="#DCDCDC" stroke-width="1"/>
    <rect x="60" y="786" width="14" height="14" rx="3" fill="#646464"/>
    <text x="80" y="793" dominant-baseline="central" font-size="11" fill="#2D2D2D">시작·종료</text>
    <polygon points="160,786 175,793 160,800 145,793" fill="#FFFFFF" stroke="#125DE6" stroke-width="1"/>
    <text x="181" y="793" dominant-baseline="central" font-size="11" fill="#2D2D2D">판단</text>
    <rect x="230" y="786" width="14" height="14" rx="3" fill="#125DE6"/>
    <text x="250" y="793" dominant-baseline="central" font-size="11" fill="#2D2D2D">처리</text>
    <rect x="300" y="786" width="14" height="14" rx="3" fill="none" stroke="#125DE6" stroke-width="1"/>
    <text x="320" y="793" dominant-baseline="central" font-size="11" fill="#2D2D2D">반복 구간</text>
    <circle cx="398" cy="793" r="7" fill="#2D2D2D"/>
    <text x="398" y="793" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="411" y="793" dominant-baseline="central" font-size="11" fill="#2D2D2D">본문 단계</text>
  </g>
</svg>
