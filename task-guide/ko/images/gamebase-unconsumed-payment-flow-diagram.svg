<svg width="780" height="886" viewBox="0 0 780 886" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Gamebase 미소비 결제 건 조회·재처리 흐름</title>
<desc>앱 실행 또는 운영 도구에서 미소비 결제 목록을 조회합니다. 미소비 건이 없으면 처리가 필요 없고, 있으면 각 건을 순회합니다. paymentSeq가 게임 DB에 이미 있으면 이미 지급된 건이므로 바로 Consume API를 호출하고, 없으면 Get Payment Transaction 조회로 유효성을 확인한 뒤 아이템을 지급하고 DB에 기록한 다음 Consume API를 호출합니다. 모든 건을 처리한 뒤에는 미소비 목록을 재조회해 확인합니다.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- 페이지 배경 -->
<rect x="0" y="0" width="780" height="886" fill="#FCFCFC"/>

<!-- N1: 시작 (흰색 알약형) -->
<g>
  <rect x="290" y="24" width="220" height="44" rx="22" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="400" y="46" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#191919">🖥️ 앱 실행 또는 운영 도구</text>
</g>
<line x1="400" y1="68" x2="400" y2="104" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- N2: 미소비 결제 목록 조회 (흰색 카드) -->
<g>
  <rect x="290" y="104" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="400" y="126" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#191919">📋 미소비 결제 목록 조회</text>
</g>
<line x1="400" y1="148" x2="400" y2="168" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- D1: 미소비 건이 있는가? (연한 파랑 다이아몬드) -->
<g>
  <polygon points="400,168 540,224 400,280 260,224" fill="#E7F2FE" stroke="#B8DCFB"/>
  <text x="400" y="217" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#191919">미소비 건이</text>
  <text x="400" y="233" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#191919">있는가?</text>
</g>

<!-- 분기: 없음 -> 정상 종료 -->
<line x1="260" y1="224" x2="240" y2="224" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="215" y="212" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">없음</text>
<g>
  <rect x="40" y="199" width="190" height="50" rx="25" fill="#FFFFFF" stroke="#B0B0B0" stroke-dasharray="4 3"/>
  <text x="135" y="224" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#191919">✅ 정상, 처리 불필요</text>
</g>

<!-- 분기: 있음 -> 각 건 순회 -->
<line x1="400" y1="280" x2="400" y2="324" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="416" y="306" text-anchor="start" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">있음</text>

<!-- N3: 각 미소비 건 순회 (점선 테두리, 반복 구간 표시) -->
<g>
  <rect x="290" y="324" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#191919" stroke-dasharray="4 3"/>
  <text x="400" y="346" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#191919">🔁 각 미소비 건 순회</text>
</g>
<line x1="400" y1="368" x2="400" y2="390" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- D2: paymentSeq가 DB에 있는가? (연한 파랑 다이아몬드) -->
<g>
  <polygon points="400,390 560,454 400,518 240,454" fill="#E7F2FE" stroke="#B8DCFB"/>
  <text x="400" y="447" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#191919">paymentSeq가</text>
  <text x="400" y="463" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#191919">DB에 있는가?</text>
</g>

<!-- 분기: 있음(이미 지급) -> 오른쪽 채널을 돌아 Consume API 호출로 -->
<path d="M560 454 L660 454 L660 750 L512 750" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="568" y="444" text-anchor="start" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">있음, 이미 지급</text>

<!-- 분기: 없음(미지급) -> 유효성 확인 -->
<line x1="400" y1="518" x2="400" y2="560" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="416" y="542" text-anchor="start" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">없음, 미지급</text>

<!-- N4: Get Payment Transaction 조회로 유효성 확인 (흰색 카드) -->
<g>
  <rect x="230" y="560" width="340" height="48" rx="8" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="400" y="584" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#191919">🔎 Get Payment Transaction 조회로 유효성 확인</text>
</g>
<line x1="400" y1="608" x2="400" y2="648" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- N5: 아이템 지급 및 DB 기록 (파랑, 상태 변경 핵심 단계) -->
<g>
  <rect x="290" y="648" width="220" height="44" rx="8" fill="#054283"/>
  <text x="400" y="670" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">🎁 아이템 지급 및 DB 기록</text>
</g>
<line x1="400" y1="692" x2="400" y2="728" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- N6: Consume API 호출 (파랑, 상태 변경 핵심 단계) -->
<g>
  <rect x="290" y="728" width="220" height="44" rx="8" fill="#054283"/>
  <text x="400" y="750" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">☑️ Consume API 호출</text>
</g>

<!-- 되돌아가는 화살표: Consume 호출 -> 각 건 순회(다음 건) -->
<path d="M290 750 L110 750 L110 346 L288 346" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow)"/>

<!-- 종료 화살표: 전부 처리 -> 재조회 확인 -->
<line x1="400" y1="772" x2="400" y2="806" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="416" y="794" text-anchor="start" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">전부 처리</text>

<!-- N7: 미소비 목록 재조회로 확인 (흰색 알약형, 종료) -->
<g>
  <rect x="270" y="806" width="260" height="50" rx="25" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="400" y="831" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#191919">🔍 미소비 목록 재조회로 확인</text>
</g>

</svg>
