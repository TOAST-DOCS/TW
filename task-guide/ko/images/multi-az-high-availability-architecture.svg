<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Pretendard', sans-serif">
  <rect width="600" height="440" rx="12" fill="#F7F7F7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B8B8B"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#125DE6"/>
    </marker>
    <path id="ic-instance" d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
    <path id="ic-rds" fill-rule="evenodd" clip-rule="evenodd" d="M11.794 10.6476C12.0111 10.4264 12.1197 10.2327 12.1197 10.0666C12.1197 9.90046 11.0467 9.03867 8.90069 7.48123C11.309 5.69673 14.2875 5.92361 17.8364 8.16187C26.5526 8.16187 30.9419 10.8647 31.0042 16.2703C32.8867 18.0298 33.4375 19.573 32.6565 20.9002L25.1797 19.8864C23.7988 22.3133 22.0581 23.7582 19.9578 24.2211C20.1352 22.5533 20.1352 21.3962 19.9578 20.7497C16.2266 20.7497 13.734 22.9566 12.4802 27.3705C14.8915 27.9088 16.8373 29.4506 18.3178 31.9958C16.3736 32.0469 14.4277 31.8312 12.4802 31.3488C11.3257 32.5704 9.49902 33.4541 7 34C7 31.9462 7.66731 30.0056 9.00192 28.1779C5.67898 20.2395 6.60966 14.3961 11.794 10.6476Z" fill="#125DE6"/>
  </defs>

  <!-- ===== 가용성 영역 컨테이너 ===== -->
  <rect x="30" y="150" width="255" height="254" rx="8" fill="#E7F2FF"/>
  <text x="157.5" y="176" text-anchor="middle" fill="#125DE6" font-size="14" font-weight="700">가용성 영역 1</text>
  <rect x="315" y="150" width="255" height="254" rx="8" fill="#E7F2FF"/>
  <text x="442.5" y="176" text-anchor="middle" fill="#125DE6" font-size="14" font-weight="700">가용성 영역 2</text>

  <!-- ===== Load Balancer (cx=300, cy=62) ===== -->
  <circle cx="300" cy="62" r="28" fill="#FFFFFF"/>
  <g transform="translate(284, 46) scale(0.8)">
    <path d="M24 4C25.1046 4 26 4.89543 26 6V14C26 15.1046 25.1046 16 24 16H22V20H34V26.5361C35.1954 27.2278 36 28.5196 36 30C36 32.2091 34.2091 34 32 34C29.7909 34 28 32.2091 28 30C28 28.5196 28.8046 27.2278 30 26.5361V24H22V26.5361C23.1954 27.2278 24 28.5196 24 30C24 32.2091 22.2091 34 20 34C17.7909 34 16 32.2091 16 30C16 28.5196 16.8046 27.2278 18 26.5361V24H10V26.5361C11.1954 27.2278 12 28.5196 12 30C12 32.2091 10.2091 34 8 34C5.79086 34 4 32.2091 4 30C4 28.5196 4.80464 27.2278 6 26.5361V20H18V16H16C14.8954 16 14 15.1046 14 14V6C14 4.89543 14.8954 4 16 4H24Z" fill="#125DE6"/>
  </g>
  <text x="300" y="108" text-anchor="middle" fill="#2D2D2D" font-size="13">Load Balancer</text>

  <!-- ① 인스턴스 분산 배치 -->
  <rect x="30" y="121" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="39" y="134" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1</text>
  <text x="54" y="134" fill="#444444" font-size="12">인스턴스 분산 배치</text>

  <!-- ② 트래픽 분산 -->
  <rect x="340" y="53" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="349" y="66" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">2</text>
  <text x="364" y="66" fill="#444444" font-size="12">트래픽 분산</text>

  <!-- LB → 웹 서버 1 / 웹 서버 2 -->
  <line x1="287" y1="87" x2="227" y2="201" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="313" y1="87" x2="373" y2="201" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 가용성 영역 1: 웹 서버(cx=215) → 앱 서버(cx=100), cy=225 ===== -->
  <circle cx="215" cy="225" r="24" fill="#FFFFFF"/>
  <use href="#ic-instance" transform="translate(201, 211) scale(0.7)"/>
  <text x="215" y="267" text-anchor="middle" fill="#2D2D2D" font-size="13">웹 서버</text>

  <circle cx="100" cy="225" r="24" fill="#FFFFFF"/>
  <use href="#ic-instance" transform="translate(86, 211) scale(0.7)"/>
  <text x="100" y="267" text-anchor="middle" fill="#2D2D2D" font-size="13">앱 서버</text>

  <line x1="189" y1="225" x2="128" y2="225" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 가용성 영역 2: 웹 서버(cx=385) → 앱 서버(cx=500), cy=225 ===== -->
  <circle cx="385" cy="225" r="24" fill="#FFFFFF"/>
  <use href="#ic-instance" transform="translate(371, 211) scale(0.7)"/>
  <text x="385" y="267" text-anchor="middle" fill="#2D2D2D" font-size="13">웹 서버</text>

  <circle cx="500" cy="225" r="24" fill="#FFFFFF"/>
  <use href="#ic-instance" transform="translate(486, 211) scale(0.7)"/>
  <text x="500" y="267" text-anchor="middle" fill="#2D2D2D" font-size="13">앱 서버</text>

  <line x1="411" y1="225" x2="472" y2="225" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 앱 서버 → RDS Primary (두 가용성 영역 모두 같은 엔드포인트로 접속) -->
  <line x1="110" y1="276" x2="148" y2="304" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="276" x2="183" y2="320" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== RDS for MySQL Primary (cx=157.5, cy=330) ===== -->
  <circle cx="157.5" cy="330" r="24" fill="#FFFFFF"/>
  <use href="#ic-rds" transform="translate(143.5, 316) scale(0.7)"/>
  <text x="157.5" y="372" text-anchor="middle" fill="#2D2D2D" font-size="13">RDS for MySQL</text>
  <text x="157.5" y="389" text-anchor="middle" fill="#8B8B8B" font-size="12">(Primary)</text>

  <!-- ===== RDS for MySQL Standby (cx=442.5, cy=330) ===== -->
  <circle cx="442.5" cy="330" r="24" fill="#FFFFFF"/>
  <use href="#ic-rds" transform="translate(428.5, 316) scale(0.7)"/>
  <text x="442.5" y="372" text-anchor="middle" fill="#2D2D2D" font-size="13">RDS for MySQL</text>
  <text x="442.5" y="389" text-anchor="middle" fill="#8B8B8B" font-size="12">(Standby)</text>

  <!-- Primary → Standby 복제 -->
  <line x1="183" y1="330" x2="415" y2="330" stroke="#125DE6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ③ 고가용성 복제 -->
  <rect x="249" y="340" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="258" y="353" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">3</text>
  <text x="273" y="353" fill="#444444" font-size="12">고가용성 복제</text>
</svg>
