<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" width="600" height="580" font-family="'Pretendard', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">SSH 접속 실패 원인 판단 흐름</title>
  <desc id="desc">오류 메시지 유형으로 먼저 나누고, 키페어와 계정 일치 여부와 인스턴스 부팅 상태를 확인해 원인 1부터 원인 4까지 좁히는 흐름입니다.</desc>
  <rect width="600" height="580" fill="#F7F7F7"/>

  <!-- 증상 -->
  <rect x="200" y="28" width="200" height="40" rx="6" fill="#646464"/>
  <text x="300" y="48" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">SSH 접속 실패</text>
  <path d="M 300 68 L 300 93" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="300,100 296,92 304,92" fill="#8B8B8B"/>

  <!-- 판단: 오류 메시지 유형 -->
  <polygon points="300,100 400,140 300,180 200,140" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
  <text x="300" y="132" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">오류 메시지</text>
  <text x="300" y="148" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">유형은?</text>

  <!-- Connection timed out → 원인 1 -->
  <path d="M 200 140 L 100 140 L 100 223" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="100,230 96,222 104,222" fill="#8B8B8B"/>
  <text x="118" y="127" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">Connection timed out</text>

  <!-- Permission denied → 키페어 판단 -->
  <path d="M 300 180 L 300 223" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="300,230 296,222 304,222" fill="#8B8B8B"/>
  <text x="310" y="203" dominant-baseline="central" font-size="12" fill="#444444">Permission denied</text>

  <!-- Connection refused → 부팅 판단 -->
  <path d="M 400 140 L 500 140 L 500 223" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="500,230 496,222 504,222" fill="#8B8B8B"/>
  <text x="484" y="127" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">Connection refused</text>

  <!-- 원인 1 -->
  <rect x="18" y="230" width="164" height="48" rx="6" fill="#125DE6"/>
  <text x="100.0" y="246" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF">원인 1</text>
  <text x="100.0" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">네트워크 설정 문제</text>

  <!-- 판단: 키페어와 계정 -->
  <polygon points="300,230 388,270 300,310 212,270" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
  <text x="300" y="262" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">키페어와 계정이</text>
  <text x="300" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">맞는가?</text>
  <path d="M 300 310 L 300 355" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="300,362 296,354 304,354" fill="#8B8B8B"/>
  <text x="310" y="334" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">아니오</text>

  <!-- 판단: 정상 부팅 -->
  <polygon points="500,230 588,270 500,310 412,270" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
  <text x="500" y="262" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">인스턴스가 정상</text>
  <text x="500" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">부팅됐는가?</text>
  <path d="M 500 310 L 500 355" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="500,362 496,354 504,354" fill="#8B8B8B"/>
  <text x="510" y="334" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">아니오</text>

  <!-- 원인 2, 원인 4 -->
  <rect x="218" y="362" width="164" height="48" rx="6" fill="#125DE6"/>
  <text x="300.0" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF">원인 2</text>
  <text x="300.0" y="394" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">키페어 불일치</text>
  <rect x="418" y="362" width="164" height="48" rx="6" fill="#125DE6"/>
  <text x="500.0" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF">원인 4</text>
  <text x="500.0" y="394" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">부팅 실패</text>

  <!-- 원인 3 -->
  <rect x="210" y="470" width="180" height="48" rx="6" fill="#125DE6"/>
  <text x="300.0" y="486" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF">원인 3</text>
  <text x="300.0" y="502" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">OS 내부 SSH 차단</text>

  <!-- 예 → 원인 3 -->
  <path d="M 212 270 L 198 270 L 198 482 L 203 482" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="210,482 202,486 202,478" fill="#8B8B8B"/>
  <text x="197" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">예</text>
  <path d="M 412 270 L 400 270 L 400 494 L 397 494" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="390,494 398,490 398,498" fill="#8B8B8B"/>
  <text x="400" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">예</text>

  <!-- 원인 1에서 설정이 모두 정상인데도 실패 → 원인 3 -->
  <path d="M 100 278 L 100 506 L 203 506" fill="none" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="210,506 202,510 202,502" fill="#8B8B8B"/>
  <text x="108" y="376" dominant-baseline="central" font-size="12" fill="#444444">설정이 모두</text>
  <text x="108" y="392" dominant-baseline="central" font-size="12" fill="#444444">정상인데도</text>
  <text x="108" y="408" dominant-baseline="central" font-size="12" fill="#444444">실패</text>

  <!-- 범례 -->
  <line x1="24" y1="540" x2="576" y2="540" stroke="#DCDCDC" stroke-width="1"/>
  <rect x="40" y="551" width="14" height="14" rx="3" fill="#646464"/>
  <text x="60" y="558" dominant-baseline="central" font-size="11" fill="#2D2D2D">증상</text>
  <polygon points="115,551 128,558 115,565 102,558" fill="#FFFFFF" stroke="#125DE6" stroke-width="1"/>
  <text x="134" y="558" dominant-baseline="central" font-size="11" fill="#2D2D2D">판단</text>
  <rect x="172" y="551" width="14" height="14" rx="3" fill="#125DE6"/>
  <text x="192" y="558" dominant-baseline="central" font-size="11" fill="#2D2D2D">원인과 해결</text>
</svg>
