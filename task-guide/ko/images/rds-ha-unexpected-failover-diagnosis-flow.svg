<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="'Pretendard', sans-serif">
  <!-- 배경 -->
  <rect width="600" height="340" fill="#F7F7F7"/>

  <!-- 전체 콘텐츠 가운데 정렬 -->
  <g transform="translate(38, 5)">

    <!-- ==================== 노드 ==================== -->

    <!-- 증상: 예기치 않은 장애 조치 발생 -->
    <rect x="40" y="20" width="240" height="34" rx="6" fill="#646464"/>
    <text x="160" y="37" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="13" font-weight="bold">예기치 않은 장애 조치 발생</text>

    <!-- 원인 확인 세로 라벨 (1~3단계 그룹) -->
    <rect x="10" y="72" width="24" height="184" rx="4" fill="#003087"/>
    <text x="22" y="164" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="12" font-weight="bold" transform="rotate(-90, 22, 164)">원인 확인</text>

    <!-- 1단계 -->
    <rect x="40" y="76" width="240" height="44" rx="6" fill="#FFFFFF" stroke="#8B8B8B" stroke-width="1.5"/>
    <text x="160" y="90" text-anchor="middle" dominant-baseline="central" fill="#2D2D2D" font-size="13" font-weight="bold">1단계</text>
    <text x="160" y="108" text-anchor="middle" dominant-baseline="central" fill="#2D2D2D" font-size="12">발생 일시 · Ping 간격 확인</text>

    <!-- 2단계 -->
    <rect x="40" y="142" width="240" height="44" rx="6" fill="#FFFFFF" stroke="#8B8B8B" stroke-width="1.5"/>
    <text x="160" y="156" text-anchor="middle" dominant-baseline="central" fill="#2D2D2D" font-size="13" font-weight="bold">2단계</text>
    <text x="160" y="174" text-anchor="middle" dominant-baseline="central" fill="#2D2D2D" font-size="12">서버 대시보드 지표 확인</text>

    <!-- 3단계 -->
    <rect x="40" y="208" width="240" height="44" rx="6" fill="#FFFFFF" stroke="#8B8B8B" stroke-width="1.5"/>
    <text x="160" y="222" text-anchor="middle" dominant-baseline="central" fill="#2D2D2D" font-size="13" font-weight="bold">3단계</text>
    <text x="160" y="240" text-anchor="middle" dominant-baseline="central" fill="#2D2D2D" font-size="12">복구 후 로그 확인</text>

    <!-- 해결 (통합): 추정 원인에 따른 해결 방법 확인 -->
    <rect x="375" y="142" width="140" height="110" rx="6" fill="#125DE6"/>
    <text x="445" y="189" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="13">추정 원인에 따른</text>
    <text x="445" y="205" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="13">해결 방법 확인</text>

    <!-- 안내/이관: 고객지원 문의 (해결 박스 아래) -->
    <rect x="375" y="280" width="140" height="34" rx="6" fill="#646464"/>
    <text x="445" y="297" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="13">고객지원 문의</text>

    <!-- ==================== 화살표 ==================== -->

    <!-- 증상 → 1단계 -->
    <line x1="160" y1="54" x2="160" y2="76" stroke="#8B8B8B" stroke-width="1.5"/>
    <polygon points="156.5,68 160,76 163.5,68" fill="#8B8B8B"/>

    <!-- 1단계 → 2단계 -->
    <line x1="160" y1="120" x2="160" y2="142" stroke="#8B8B8B" stroke-width="1.5"/>
    <polygon points="156.5,134 160,142 163.5,134" fill="#8B8B8B"/>

    <!-- 2단계 → 3단계 -->
    <line x1="160" y1="186" x2="160" y2="208" stroke="#8B8B8B" stroke-width="1.5"/>
    <polygon points="156.5,200 160,208 163.5,200" fill="#8B8B8B"/>

    <!-- 2단계 → 해결 (오른쪽) -->
    <line x1="280" y1="164" x2="375" y2="164" stroke="#8B8B8B" stroke-width="1.5"/>
    <polygon points="367,160.5 375,164 367,167.5" fill="#8B8B8B"/>

    <!-- 3단계 → 해결 (오른쪽) -->
    <line x1="280" y1="230" x2="375" y2="230" stroke="#8B8B8B" stroke-width="1.5"/>
    <polygon points="367,226.5 375,230 367,233.5" fill="#8B8B8B"/>

    <!-- 해결 → 고객지원 문의 (아래, "미해결 시" 라벨) -->
    <line x1="445" y1="252" x2="445" y2="280" stroke="#8B8B8B" stroke-width="1.5"/>
    <polygon points="441.5,272 445,280 448.5,272" fill="#8B8B8B"/>
    <text x="457" y="270" fill="#444444" font-size="11">미해결 시</text>

  </g>

</svg>