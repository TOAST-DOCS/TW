<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Pretendard', sans-serif">
  <rect width="600" height="480" rx="12" fill="#F7F7F7"/>

  <!-- ===== NHN Cloud 영역 ===== -->
  <rect x="20" y="10" width="560" height="460" rx="8" fill="#E7F2FF" opacity="0.4"/>
  <text x="36" y="30" fill="#125DE6" font-size="14" font-weight="700">NHN Cloud</text>

  <!-- ===== Network Firewall 컨테이너 ===== -->
  <rect x="148" y="42" width="304" height="200" rx="8" fill="#FFFFFF"/>

  <!-- NF 아이콘 + 타이틀 -->
  <g transform="translate(158, 50) scale(0.4)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M14.0001 21V24.4285H21.7143V21H14.0001ZM14 25.2859V28.7144H25.9998V25.2859H14ZM22.5715 24.4285V21H26V24.4285H22.5715ZM14 29.5715V33H17.4285V29.5715H14ZM18.2859 32.9998V29.5713H26V32.9998H18.2859Z" fill="#125DE6"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M10.2222 28.9998L10.2706 28.9996H12.7L12.7001 23.9859V19.7H27.3L27.2997 25.7285L27.3 28.2713V28.9996H27.9161C27.944 28.9999 27.972 29 28 29C32.4183 29 36 25.4355 36 21.0384C36 16.736 32.5707 13.2306 28.284 13.0818C26.821 8.95626 22.8687 6 18.2225 6C12.3315 6 7.55585 10.7527 7.55585 16.6154C7.55585 16.8127 7.56126 17.0087 7.57193 17.2033C5.46093 18.1938 4 20.3308 4 22.8074C4 26.2274 6.78578 28.9998 10.2222 28.9998ZM21.7142 24.4285H14.0001V21H21.7142V24.4285ZM25.9997 24.4285H22.5715V21H26L25.9997 24.4285ZM14 28.7144L14.0001 25.2859H25.9997V28.7144H14Z" fill="#125DE6"/>
  </g>
  <text x="178" y="65" fill="#125DE6" font-size="13" font-weight="700">Network Firewall</text>

  <!-- ===== 객체 등록 외곽선 박스 ===== -->
  <rect x="158" y="76" width="284" height="92" rx="6" fill="none" stroke="#125DE6" stroke-width="1.5"/>

  <!-- IP 객체 서브박스 -->
  <rect x="166" y="108" width="130" height="52" rx="4" fill="#F7F7F7"/>
  <text x="231" y="122" text-anchor="middle" fill="#444444" font-size="11" font-weight="600">IP 객체</text>
  <text x="231" y="137" text-anchor="middle" fill="#2D2D2D" font-size="11">web-subnet</text>
  <text x="231" y="152" text-anchor="middle" fill="#2D2D2D" font-size="11">db-subnet</text>

  <!-- 포트 객체 서브박스 -->
  <rect x="304" y="108" width="130" height="52" rx="4" fill="#F7F7F7"/>
  <text x="369" y="122" text-anchor="middle" fill="#444444" font-size="11" font-weight="600">포트 객체</text>
  <text x="369" y="137" text-anchor="middle" fill="#2D2D2D" font-size="11">mysql-port</text>
  <text x="369" y="152" text-anchor="middle" fill="#2D2D2D" font-size="11">(TCP/3306)</text>

  <!-- ===== ① IP 객체 등록 ===== -->
  <rect x="168" y="86" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="177" y="99" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1</text>
  <text x="191" y="99" fill="#444444" font-size="11">IP 객체 등록</text>

  <!-- ===== ② 포트 객체 등록 ===== -->
  <rect x="304" y="86" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="313" y="99" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">2</text>
  <text x="327" y="99" fill="#444444" font-size="11">포트 객체 등록</text>

  <!-- ===== 객체 → ACL 정책 화살표 (vertical down) ===== -->
  <line x1="300" y1="168" x2="300" y2="198" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="296.5,198 300,206 303.5,198" fill="#8B8B8B"/>

  <!-- ===== ③ 정책 추가 ===== -->
  <rect x="316" y="172" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="325" y="185" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">3</text>
  <text x="338" y="185" fill="#444444" font-size="11">정책 추가</text>

  <!-- ===== ACL 정책 외곽선 노드 ===== -->
  <rect x="250" y="206" width="100" height="28" rx="6" fill="none" stroke="#125DE6" stroke-width="1.5"/>
  <text x="300" y="220" text-anchor="middle" dominant-baseline="central" fill="#125DE6" font-size="11" font-weight="600">ACL 정책</text>

  <!-- ===== 웹 서브넷 ===== -->
  <rect x="24" y="200" width="110" height="40" rx="6" fill="#646464"/>
  <text x="79" y="215" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">웹 서브넷</text>
  <text x="79" y="231" text-anchor="middle" fill="#DCDCDC" font-size="11">(출발지)</text>

  <!-- ===== DB 서브넷 ===== -->
  <rect x="466" y="200" width="110" height="40" rx="6" fill="#646464"/>
  <text x="521" y="215" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">DB 서브넷</text>
  <text x="521" y="231" text-anchor="middle" fill="#DCDCDC" font-size="11">(목적지)</text>

  <!-- 웹 서브넷 → ACL 정책 (horizontal right) -->
  <line x1="134" y1="220" x2="242" y2="220" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="242,216.5 250,220 242,223.5" fill="#8B8B8B"/>

  <!-- 허용 화살표 (ACL → DB, 실선) -->
  <line x1="352" y1="214" x2="458" y2="214" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="458,210.5 466,214 458,217.5" fill="#8B8B8B"/>
  <text x="408" y="206" text-anchor="middle" fill="#444444" font-size="11">허용</text>

  <!-- 차단 화살표 (ACL → DB, 점선) -->
  <line x1="352" y1="228" x2="458" y2="228" stroke="#8B8B8B" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="458,224.5 466,228 458,231.5" fill="#8B8B8B"/>
  <text x="408" y="244" text-anchor="middle" fill="#444444" font-size="11">차단</text>

  <!-- ===== ④ 로그 확인 (vertical down) ===== -->
  <line x1="300" y1="242" x2="300" y2="354" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="296.5,354 300,362 303.5,354" fill="#8B8B8B"/>

  <rect x="316" y="294" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="325" y="307" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">4</text>
  <text x="338" y="307" fill="#444444" font-size="11">로그 확인</text>

  <!-- ===== 트래픽 로그 ===== -->
  <rect x="250" y="362" width="100" height="34" rx="6" fill="#646464"/>
  <text x="300" y="379" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="11" font-weight="600">트래픽 로그</text>

  <!-- ===== ⑤ 외부 로그 전송 (horizontal right) ===== -->
  <line x1="350" y1="379" x2="446" y2="379" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="446,375.5 454,379 446,382.5" fill="#8B8B8B"/>

  <rect x="356" y="350" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="365" y="363" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">5</text>
  <text x="379" y="363" fill="#444444" font-size="11">외부 로그 전송</text>

  <!-- ===== Log &amp; Crash Search ===== -->
  <circle cx="480" cy="379" r="26" fill="#FFFFFF"/>
  <g transform="translate(468, 367) scale(0.55)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M21.725 6.73489C21.5492 6.43012 21.2962 6.17709 20.9914 6.00135C20.0346 5.44959 18.8116 5.77801 18.2598 6.73489L4.2674 31.0009C4.09222 31.3048 4 31.6493 4 32C4 33.1046 4.89543 34 6 34H33.9848C34.3355 34 34.68 33.9078 34.9838 33.7326C35.9407 33.1808 36.2691 31.9578 35.7174 31.0009L21.725 6.73489ZM17.9926 16V24H21.9926V16H17.9926ZM17.9926 30V26H21.9926V30H17.9926Z" fill="#125DE6"/>
  </g>
  <text x="480" y="420" text-anchor="middle" fill="#2D2D2D" font-size="12" font-weight="600">Log &amp; Crash Search</text>
</svg>
