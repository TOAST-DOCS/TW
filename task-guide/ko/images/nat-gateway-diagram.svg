<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 페이지 배경 -->
  <rect x="0" y="0" width="960" height="340" fill="#FCFCFC"/>

  <!-- Box 1: Private instance (중립 인프라 노드, 테두리 없음) -->
  <rect x="40" y="100" width="220" height="110" rx="14" fill="#E7F2FE"/>
  <text x="150" y="148" text-anchor="middle" font-size="18" font-weight="600" fill="#054283">프라이빗 서브넷</text>
  <text x="150" y="174" text-anchor="middle" font-size="18" font-weight="600" fill="#054283">인스턴스</text>

  <!-- Box 2: NAT Gateway (핵심 서비스 노드 → 파란 채움) -->
  <rect x="370" y="100" width="230" height="110" rx="14" fill="#0F80F6"/>
  <text x="485" y="148" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">NAT Gateway</text>
  <text x="485" y="174" text-anchor="middle" font-size="15" fill="#FFFFFF" fill-opacity="0.85">(퍼블릭 서브넷)</text>

  <!-- Box 3: Internet (중립 인프라 노드) -->
  <rect x="710" y="100" width="200" height="110" rx="14" fill="#E7F2FE"/>
  <text x="810" y="162" text-anchor="middle" font-size="18" font-weight="600" fill="#054283">인터넷</text>

  <!-- Arrow 1: Private -> NAT (라우팅, 정상 데이터 흐름) -->
  <line x1="262" y1="155" x2="355" y2="155" stroke="#0F80F6" stroke-width="2.5"/>
  <path d="M355,148.5 L367,155 L355,161.5 Z" fill="#0F80F6"/>
  <text x="314" y="140" text-anchor="middle" font-size="14" fill="#646464">라우팅</text>

  <!-- Arrow 2: NAT -> Internet (플로팅 IP로 변환) -->
  <line x1="602" y1="155" x2="695" y2="155" stroke="#0F80F6" stroke-width="2.5"/>
  <path d="M695,148.5 L707,155 L695,161.5 Z" fill="#0F80F6"/>
  <text x="654" y="140" text-anchor="middle" font-size="14" fill="#646464">플로팅 IP로 변환</text>

  <!-- Return path: Internet -> Private, blocked before reaching the instance -->
  <path d="M 780,210 C 780,318 145,318 145,258"
        fill="none" stroke="#8B8B8B" stroke-width="2" stroke-dasharray="6,5"/>
  <path d="M139,258 L145,246 L151,258 Z" fill="#8B8B8B"/>

  <!-- 차단 아이콘 (❌ 아이콘 + 점선 = 명시적 차단, Warning Red) -->
  <circle cx="145" cy="228" r="14" fill="#FFFFFF" fill-opacity="0" stroke="#EF4444" stroke-width="2.5"/>
  <line x1="135.7" y1="218.7" x2="154.3" y2="237.3" stroke="#EF4444" stroke-width="2.5"/>
  <text x="168" y="233" text-anchor="start" font-size="14" fill="#646464">인바운드 차단</text>
</svg>
