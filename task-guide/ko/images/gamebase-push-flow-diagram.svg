<svg width="680" height="424" viewBox="0 0 680 424" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Gamebase Push 메시지 발송 흐름</title>
<desc>게임 클라이언트가 로그인 후 Push 토큰을 Gamebase에 등록하면 Gamebase가 이 토큰을 NHN Cloud Push로 전달합니다. 운영자가 Gamebase 콘솔에서 메시지를 발송하면 NHN Cloud Push가 등록된 토큰을 기준으로 FCM을 통해 Android 디바이스에, APNs를 통해 iOS 디바이스에 메시지를 전달합니다.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- 페이지 배경 -->
<rect x="0" y="0" width="680" height="424" fill="#FCFCFC"/>

<!-- Tier 1: 게임 클라이언트 (액터, 흰색 카드) -->
<g>
  <rect x="60" y="40" width="180" height="44" rx="8" fill="#FFFFFF"/>
  <text x="150" y="62" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#191919">🖥️ 게임 클라이언트</text>
</g>

<!-- Tier 1: 운영자 (Gamebase 콘솔) (액터, 흰색 카드) -->
<g>
  <rect x="420" y="40" width="210" height="44" rx="8" fill="#FFFFFF"/>
  <text x="525" y="62" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#191919">👤 운영자 (Gamebase 콘솔)</text>
</g>

<!-- Tier 2: Gamebase (핵심 내부 서비스, 파랑) -->
<g>
  <rect x="60" y="140" width="180" height="44" rx="8" fill="#054283"/>
  <text x="150" y="162" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">🗄️ Gamebase</text>
</g>

<!-- Tier 3: NHN Cloud Push (핵심 내부 서비스, 파랑) -->
<g>
  <rect x="250" y="240" width="180" height="44" rx="8" fill="#054283"/>
  <text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">🗄️ NHN Cloud Push</text>
</g>

<!-- Tier 4: Android 디바이스 (중립 인프라, 연한 파랑) -->
<g>
  <rect x="140" y="340" width="170" height="44" rx="8" fill="#E7F2FE"/>
  <text x="225" y="362" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#191919">📱 Android 디바이스</text>
</g>

<!-- Tier 4: iOS 디바이스 (중립 인프라, 연한 파랑) -->
<g>
  <rect x="370" y="340" width="170" height="44" rx="8" fill="#E7F2FE"/>
  <text x="455" y="362" text-anchor="middle" dominant-baseline="central" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#191919">📱 iOS 디바이스</text>
</g>

<!-- 화살표: 게임 클라이언트 -> Gamebase -->
<line x1="150" y1="84" x2="150" y2="140" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="165" y="115" text-anchor="start" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">로그인 · Push 토큰 등록</text>

<!-- 화살표: Gamebase -> NHN Cloud Push -->
<path d="M150 184 L150 210 L340 210 L340 240" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180" y="200" text-anchor="start" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">토큰 전달</text>

<!-- 화살표: 운영자 -> NHN Cloud Push -->
<path d="M525 84 L525 210 L400 210 L400 240" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420" y="200" text-anchor="start" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">메시지 발송</text>

<!-- 화살표: NHN Cloud Push -> Android -->
<path d="M300 284 L300 310 L225 310 L225 340" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235" y="300" text-anchor="start" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">FCM</text>

<!-- 화살표: NHN Cloud Push -> iOS -->
<path d="M380 284 L380 310 L455 310 L455 340" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390" y="300" text-anchor="start" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#646464">APNs</text>

</svg>
