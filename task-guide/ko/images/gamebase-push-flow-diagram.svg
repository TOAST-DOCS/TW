<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" width="600" height="690" font-family="'Pretendard', sans-serif" role="img">
  <title>Gamebase 푸시 메시지 발송 흐름</title>
  <desc>운영자가 Gamebase 콘솔에서 인증 정보를 등록하고(1), 게임 클라이언트가 로그인 후 푸시 토큰을 Gamebase에 등록합니다(2). 운영자가 Gamebase 콘솔에서 메시지를 발송하면(3) Gamebase가 토큰과 메시지를 NHN Cloud Push로 전달하고, NHN Cloud Push가 FCM을 거쳐 Android 디바이스에, APNs를 거쳐 iOS 디바이스에 메시지를 발송합니다(4).</desc>
  <defs>
    <marker id="arrow-default" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8B8B8B"/>
    </marker>
  </defs>

  <rect width="600" height="690" fill="#F7F7F7"/>

  <!-- ===== 주체 ===== -->
  <!-- 운영자 -->
  <circle cx="150" cy="70" r="30" fill="#FFFFFF"/>
  <g transform="translate(132.6, 52.6) scale(0.6)">
    <circle cx="29" cy="17" r="10" fill="#C8CCD4"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M50 50C50 37.2174 40.598 29 29 29C17.402 29 8 37.2174 8 50H50Z" fill="#C8CCD4"/>
  </g>
  <text x="150" y="116" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">운영자</text>
  <text x="150" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B8B8B">(Gamebase 콘솔)</text>

  <!-- 게임 클라이언트 -->
  <rect x="370" y="50" width="160" height="40" rx="6" fill="#646464"/>
  <text x="450" y="70" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">게임 클라이언트</text>

  <!-- ===== NHN Cloud 영역 ===== -->
  <rect x="60" y="160" width="480" height="310" rx="8" fill="#E7F2FF"/>
  <text x="300" y="186" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#125DE6">NHN Cloud</text>

  <!-- Gamebase -->
  <circle cx="300" cy="260" r="30" fill="#FFFFFF"/>
  <g transform="translate(282, 242) scale(0.9)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M22 7H18V15H22V7ZM29.2625 33C34.0895 33 38 28.968 38 24C38 19.143 34.259 15.1845 29.582 15.0105L10.7375 15C5.912 15 2 19.032 2 24C2 28.968 5.912 33 10.7375 33C12.9725 33 15.011 32.1315 16.556 30.7095C18.464 28.9545 21.4145 28.809 23.381 30.6525C24.9335 32.1075 26.996 33 29.2625 33ZM12 21H10V23H8V25H10V27H12V25H14V23H12V21ZM29 21C30.6569 21 32 22.3431 32 24C32 25.6569 30.6569 27 29 27C27.3431 27 26 25.6569 26 24C26 22.3431 27.3431 21 29 21ZM30 23H28V25H30V23Z" fill="#125DE6"/>
  </g>
  <text x="300" y="306" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">Gamebase</text>

  <!-- ①·③ 운영자 → Gamebase -->
  <path d="M150 144 L150 260 L270 260" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <circle cx="168" cy="216" r="9" fill="#2D2D2D"/>
  <text x="168" y="216" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="182" y="216" dominant-baseline="central" font-size="12" fill="#444444">인증 정보 등록</text>
  <circle cx="168" cy="238" r="9" fill="#2D2D2D"/>
  <text x="168" y="238" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="182" y="238" dominant-baseline="central" font-size="12" fill="#444444">메시지 발송</text>

  <!-- ② 게임 클라이언트 → Gamebase -->
  <path d="M450 90 L450 260 L330 260" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <circle cx="346" cy="216" r="9" fill="#2D2D2D"/>
  <text x="346" y="216" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="360" y="216" dominant-baseline="central" font-size="12" fill="#444444">푸시 토큰 등록</text>

  <!-- Gamebase → NHN Cloud Push -->
  <line x1="300" y1="318" x2="300" y2="360" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <text x="312" y="339" dominant-baseline="central" font-size="12" fill="#444444">토큰·메시지 전달</text>

  <!-- NHN Cloud Push -->
  <circle cx="300" cy="390" r="30" fill="#FFFFFF"/>
  <g transform="translate(282, 372) scale(0.9)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M18 7.16592V3H22V7.16592C27.6754 8.11807 32 13.054 32 19V27H34V31H32H8H6V27H8V19C8 13.054 12.3246 8.11807 18 7.16592ZM16 33C16 35.2091 17.7909 37 20 37C22.2091 37 24 35.2091 24 33H16Z" fill="#125DE6"/>
  </g>
  <text x="300" y="436" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">NHN Cloud Push</text>

  <!-- ④ 발송: NHN Cloud Push → FCM / APNs -->
  <line x1="300" y1="448" x2="300" y2="498" stroke="#8B8B8B" stroke-width="1.5"/>
  <path d="M300 498 L170 498 L170 520" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <path d="M300 498 L430 498 L430 520" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <circle cx="318" cy="480" r="9" fill="#2D2D2D"/>
  <text x="318" y="480" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="332" y="480" dominant-baseline="central" font-size="12" fill="#444444">발송</text>

  <!-- 외부 시스템 -->
  <rect x="100" y="520" width="140" height="40" rx="6" fill="#646464"/>
  <text x="170" y="540" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">FCM</text>
  <rect x="360" y="520" width="140" height="40" rx="6" fill="#646464"/>
  <text x="430" y="540" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">APNs</text>

  <!-- 디바이스 -->
  <line x1="170" y1="560" x2="170" y2="586" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <line x1="430" y1="560" x2="430" y2="586" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
  <rect x="100" y="586" width="140" height="40" rx="6" fill="#FFFFFF"/>
  <text x="170" y="606" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">Android 디바이스</text>
  <rect x="360" y="586" width="140" height="40" rx="6" fill="#FFFFFF"/>
  <text x="430" y="606" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">iOS 디바이스</text>

  <!-- 범례 -->
  <line x1="60" y1="646" x2="540" y2="646" stroke="#DCDCDC" stroke-width="1"/>
  <rect x="60" y="660" width="14" height="14" rx="3" fill="#E7F2FF"/>
  <text x="80" y="667" dominant-baseline="central" font-size="11" fill="#2D2D2D">NHN Cloud 영역</text>
  <rect x="180" y="660" width="14" height="14" rx="3" fill="#646464"/>
  <text x="200" y="667" dominant-baseline="central" font-size="11" fill="#2D2D2D">외부 시스템</text>
  <rect x="285" y="660" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="305" y="667" dominant-baseline="central" font-size="11" fill="#2D2D2D">디바이스</text>
  <circle cx="383" cy="667" r="7" fill="#2D2D2D"/>
  <text x="383" y="667" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="396" y="667" dominant-baseline="central" font-size="11" fill="#2D2D2D">본문 단계</text>
</svg>
