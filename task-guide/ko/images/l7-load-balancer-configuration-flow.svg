<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Pretendard', sans-serif">
  <rect width="600" height="380" rx="12" fill="#F7F7F7"/>

  <!-- ===== NHN Cloud 영역 ===== -->
  <rect x="155" y="20" width="430" height="340" rx="8" fill="#E7F2FF" opacity="0.4"/>
  <text x="171" y="40" fill="#125DE6" font-size="14" font-weight="700">NHN Cloud</text>

  <!-- ===== 클라이언트 (cx=65, cy=190) ===== -->
  <circle cx="65" cy="190" r="30" fill="#FFFFFF"/>
  <g transform="translate(48.6, 173.6) scale(0.6)">
    <circle cx="29" cy="17" r="10" fill="#C8CCD4"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M50 50C50 37.2174 40.598 29 29 29C17.402 29 8 37.2174 8 50H50Z" fill="#C8CCD4"/>
  </g>
  <text x="65" y="236" text-anchor="middle" fill="#2D2D2D" font-size="13" font-weight="600">클라이언트</text>

  <!-- ===== HTTP 화살표 (클라이언트 → LB) ===== -->
  <line x1="95" y1="190" x2="208" y2="190" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="208,186.5 216,190 208,193.5" fill="#8B8B8B"/>
  <text x="157" y="180" text-anchor="middle" fill="#444444" font-size="11" font-weight="600">HTTP</text>

  <!-- ===== L7 Load Balancer (cx=250, cy=190) ===== -->
  <circle cx="250" cy="190" r="34" fill="#FFFFFF"/>
  <g transform="translate(236, 176) scale(0.7)">
    <path d="M24 4C25.1046 4 26 4.89543 26 6V14C26 15.1046 25.1046 16 24 16H22V20H34V26.5361C35.1954 27.2278 36 28.5196 36 30C36 32.2091 34.2091 34 32 34C29.7909 34 28 32.2091 28 30C28 28.5196 28.8046 27.2278 30 26.5361V24H22V26.5361C23.1954 27.2278 24 28.5196 24 30C24 32.2091 22.2091 34 20 34C17.7909 34 16 32.2091 16 30C16 28.5196 16.8046 27.2278 18 26.5361V24H10V26.5361C11.1954 27.2278 12 28.5196 12 30C12 32.2091 10.2091 34 8 34C5.79086 34 4 32.2091 4 30C4 28.5196 4.80464 27.2278 6 26.5361V20H18V16H16C14.8954 16 14 15.1046 14 14V6C14 4.89543 14.8954 4 16 4H24Z" fill="#125DE6"/>
  </g>
  <text x="250" y="242" text-anchor="middle" fill="#2D2D2D" font-size="13" font-weight="600">Load Balancer</text>

  <!-- ===== L7 규칙 외곽선 노드 ===== -->
  <rect x="212" y="250" width="76" height="24" rx="6" fill="none" stroke="#125DE6" stroke-width="1.5"/>
  <text x="250" y="262" text-anchor="middle" dominant-baseline="central" fill="#125DE6" font-size="11" font-weight="600">L7 규칙</text>

  <!-- ===== API 서버 풀 ===== -->
  <rect x="400" y="70" width="140" height="40" rx="6" fill="#646464"/>
  <text x="470" y="84" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">API 서버 풀</text>
  <text x="470" y="100" text-anchor="middle" fill="#DCDCDC" font-size="11">(api-pool)</text>

  <!-- ===== 기본 웹 서버 풀 ===== -->
  <rect x="400" y="170" width="140" height="40" rx="6" fill="#646464"/>
  <text x="470" y="184" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">기본 웹 서버 풀</text>
  <text x="470" y="200" text-anchor="middle" fill="#DCDCDC" font-size="11">(default-web-pool)</text>

  <!-- ===== 정적 서버 풀 ===== -->
  <rect x="400" y="270" width="140" height="40" rx="6" fill="#646464"/>
  <text x="470" y="284" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">정적 서버 풀</text>
  <text x="470" y="300" text-anchor="middle" fill="#DCDCDC" font-size="11">(static-pool)</text>

  <!-- /api/* → API 서버 풀 (angled up-right) -->
  <line x1="284" y1="178" x2="392" y2="93" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="393,97 400,90 391,90" fill="#8B8B8B"/>
  <rect x="310" y="108" width="62" height="20" rx="4" fill="#EEEEEE"/>
  <text x="341" y="122" text-anchor="middle" fill="#2D2D2D" font-size="11" font-family="'Consolas', 'Courier New', monospace">/api/*</text>

  <!-- /* (기본) → 기본 웹 서버 풀 (horizontal) -->
  <line x1="284" y1="190" x2="392" y2="190" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="392,186.5 400,190 392,193.5" fill="#8B8B8B"/>
  <rect x="306" y="172" width="78" height="20" rx="4" fill="#EEEEEE"/>
  <text x="345" y="186" text-anchor="middle" fill="#2D2D2D" font-size="11" font-family="'Consolas', 'Courier New', monospace">/* (기본)</text>

  <!-- /static/* → 정적 서버 풀 (angled down-right) -->
  <line x1="284" y1="202" x2="392" y2="287" stroke="#8B8B8B" stroke-width="1.5"/>
  <polygon points="391,283 400,290 393,290" fill="#8B8B8B"/>
  <rect x="307" y="254" width="70" height="20" rx="4" fill="#EEEEEE"/>
  <text x="342" y="268" text-anchor="middle" fill="#2D2D2D" font-size="11" font-family="'Consolas', 'Courier New', monospace">/static/*</text>
</svg>
