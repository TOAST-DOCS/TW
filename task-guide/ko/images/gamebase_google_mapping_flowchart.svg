<svg viewBox="0 0 1100 960" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1100" height="960" fill="#FCFCFC"/>

  <text x="550" y="34" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#191919">게스트 계정 → Google 계정 매핑 처리 흐름</text>

  <!-- A: 앱 첫 실행 -->
  <rect x="460" y="60" width="180" height="60" fill="#FFFFFF"/>
  <text x="550" y="96" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="500" fill="#191919">앱 첫 실행</text>

  <!-- Arrow A -> B -->
  <line x1="550" y1="120" x2="550" y2="164" stroke="#444444" stroke-width="2.5"/>
  <polygon points="550,170 543,158 557,158" fill="#444444"/>
  <text x="640" y="146" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">게스트 로그인</text>

  <!-- B: 게스트 userId 발급 -->
  <rect x="460" y="170" width="180" height="60" fill="#FFFFFF"/>
  <text x="550" y="206" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="500" fill="#191919">게스트 userId 발급</text>

  <!-- Arrow B -> C -->
  <line x1="550" y1="230" x2="550" y2="274" stroke="#444444" stroke-width="2.5"/>
  <polygon points="550,280 543,268 557,268" fill="#444444"/>
  <text x="660" y="256" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">Google 연결 요청</text>

  <!-- C: diamond (AddMapping 호출) -->
  <polygon points="550,280 680,335 550,390 420,335" fill="#FFFFFF"/>
  <text x="550" y="330" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#191919">AddMapping 호출</text>
  <text x="550" y="348" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#191919">(Google 연결 요청)</text>

  <!-- Branch left: C -> D -->
  <line x1="420" y1="335" x2="330" y2="335" stroke="#444444" stroke-width="2.5"/>
  <line x1="330" y1="335" x2="330" y2="434" stroke="#444444" stroke-width="2.5"/>
  <polygon points="330,440 323,428 337,428" fill="#444444"/>
  <text x="330" y="320" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" font-weight="500" fill="#646464">매핑 성공</text>

  <!-- D: 성공 결과 -->
  <rect x="220" y="440" width="220" height="90" fill="#FFFFFF"/>
  <g transform="translate(238,458)">
    <circle cx="7" cy="7" r="9" fill="#16A34A"/>
    <path d="M 3 7.2 L 5.8 10 L 11.2 4" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="337" y="472" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#191919">기존 게스트 userId 유지</text>
  <text x="330" y="494" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#191919">Google 계정 연결됨</text>

  <!-- Branch right: C -> E -->
  <line x1="680" y1="335" x2="770" y2="335" stroke="#444444" stroke-width="2.5"/>
  <line x1="770" y1="335" x2="770" y2="424" stroke="#444444" stroke-width="2.5"/>
  <polygon points="770,430 763,418 777,418" fill="#444444"/>
  <text x="825" y="316" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" font-weight="500" fill="#646464">이미 다른 계정에</text>
  <text x="825" y="332" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" font-weight="500" fill="#646464">연결된 Google 계정</text>

  <!-- E: 오류 코드 -->
  <rect x="600" y="430" width="340" height="90" fill="#FCA5A5"/>
  <text x="770" y="466" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#191919">AUTH_ADD_MAPPING_ALREADY_</text>
  <text x="770" y="484" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#191919">MAPPED_TO_OTHER_MEMBER</text>
  <text x="770" y="506" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="11" fill="#191919">(오류 코드)</text>

  <!-- Arrow E -> F -->
  <line x1="770" y1="520" x2="770" y2="554" stroke="#444444" stroke-width="2.5"/>
  <polygon points="770,560 763,548 777,548" fill="#444444"/>

  <!-- F: ForcingMappingTicket 발급 -->
  <rect x="650" y="560" width="240" height="70" fill="#FFFFFF"/>
  <text x="770" y="590" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#191919">ForcingMappingTicket</text>
  <text x="770" y="610" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="14" font-weight="500" fill="#191919">발급</text>

  <!-- Fan-out arrows F -> G,H,I -->
  <!-- to G (left) -->
  <line x1="700" y1="630" x2="555" y2="630" stroke="#444444" stroke-width="2.5"/>
  <line x1="555" y1="630" x2="555" y2="694" stroke="#444444" stroke-width="2.5"/>
  <polygon points="555,700 548,688 562,688" fill="#444444"/>
  <text x="555" y="666" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">강제 매핑</text>

  <!-- to H (center, straight down) -->
  <line x1="770" y1="630" x2="770" y2="694" stroke="#444444" stroke-width="2.5"/>
  <polygon points="770,700 763,688 777,688" fill="#444444"/>
  <text x="880" y="668" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">기존 계정으로</text>
  <text x="880" y="684" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">로그인 전환</text>

  <!-- to I (right) -->
  <line x1="840" y1="630" x2="985" y2="630" stroke="#444444" stroke-width="2.5"/>
  <line x1="985" y1="630" x2="985" y2="694" stroke="#444444" stroke-width="2.5"/>
  <polygon points="985,700 978,688 992,688" fill="#444444"/>
  <text x="1030" y="666" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">매핑 포기</text>

  <!-- G: AddMappingForcibly -->
  <rect x="450" y="700" width="210" height="90" fill="#FFFFFF"/>
  <text x="555" y="736" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#191919">AddMappingForcibly</text>
  <text x="555" y="756" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" font-weight="500" fill="#191919">호출</text>
  <text x="555" y="776" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">기존 연동 해제 후 강제 연결</text>

  <!-- H: ChangeLogin -->
  <rect x="665" y="700" width="210" height="90" fill="#FFFFFF"/>
  <text x="770" y="736" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="500" fill="#191919">ChangeLogin 호출</text>
  <text x="770" y="758" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">기존 매핑 계정으로</text>
  <text x="770" y="774" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">로그인 전환</text>

  <!-- I: 게스트 상태 유지 -->
  <rect x="880" y="700" width="210" height="90" fill="#FFFFFF"/>
  <text x="985" y="736" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="500" fill="#191919">게스트 상태 유지</text>
  <text x="985" y="758" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">아무 것도 하지 않음</text>
  <text x="985" y="774" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">(매핑 시도 이전 상태)</text>
</svg>
