<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1048" width="600" height="1048" font-family="'Pretendard', sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CDN 인증서 발급·갱신 실패 진단 흐름</title>
<desc>발급 한도, 발급 취소와 도메인 검증 대기 상태의 TXT 레코드, 연동 대기 상태의 CNAME 레코드, 대기 상태 해소, 인증서 만료, 문의 기준 시간 초과 여부를 순서대로 확인합니다. 아니오에 해당하면 오른쪽 원인의 해결 방법으로 이동하고, 모두 예이면 문의 기준 시간까지 기다린 뒤 다시 확인합니다.</desc>
<defs><marker id="arrow-default" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8B8B8B"/></marker></defs>
<rect width="600" height="1048" fill="#F7F7F7"/>
<!-- 콘텐츠 x 70~580 → translate(-25)로 좌우 여백 45 균등, 상하 여백 36 균등 -->
<g transform="translate(-25, 0)">
<!-- 증상 -->
<rect x="70" y="36" width="240" height="40" rx="6" fill="#646464"/>
<text x="190.0" y="56.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">인증서 발급·갱신이 완료되지 않음</text>
<line x1="190" y1="76" x2="190" y2="104" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<!-- 판단 1 -->
<polygon points="190,104 310,146 190,188 70,146" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="190" y="138.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">취소·만료 포함 인증서가</text>
<text x="190" y="154.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">5개 미만인가?</text>
<line x1="310" y1="146" x2="370" y2="146" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="340.0" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">아니오</text>
<rect x="370" y="124.0" width="210" height="44" rx="6" fill="#125DE6"/>
<text x="475.0" y="138.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">원인 5</text>
<text x="475.0" y="154.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">인증서 정리·발급 한도 상향</text>
<line x1="190" y1="188" x2="190" y2="228" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="202" y="208" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">예</text>
<!-- 판단 2 -->
<polygon points="190,228 310,278 190,328 70,278" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="190" y="262.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">발급 취소가 아니고,</text>
<text x="190" y="278.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">도메인 검증 대기라면 TXT가</text>
<text x="190" y="294.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">조회되는가?</text>
<line x1="310" y1="278" x2="370" y2="278" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="340.0" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">아니오</text>
<rect x="370" y="256.0" width="210" height="44" rx="6" fill="#125DE6"/>
<text x="475.0" y="270.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">원인 1</text>
<text x="475.0" y="286.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">TXT 레코드 확인·발급 재요청</text>
<line x1="190" y1="328" x2="190" y2="368" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="202" y="348" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">예</text>
<!-- 판단 3 -->
<polygon points="190,368 310,418 190,468 70,418" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="190" y="402.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">연동 대기라면</text>
<text x="190" y="418.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">CNAME 레코드가</text>
<text x="190" y="434.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">조회되는가?</text>
<line x1="310" y1="418" x2="370" y2="418" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="340.0" y="408" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">아니오</text>
<rect x="370" y="396.0" width="210" height="44" rx="6" fill="#125DE6"/>
<text x="475.0" y="410.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">원인 3</text>
<text x="475.0" y="426.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">CNAME 레코드·도메인 별칭 확인</text>
<line x1="190" y1="468" x2="190" y2="508" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="202" y="488" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">예</text>
<!-- 판단 4 -->
<polygon points="190,508 310,558 190,608 70,558" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="190" y="550.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">도메인 검증·연동 대기라면</text>
<text x="190" y="566.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">조회 후 상태가 바뀌었는가?</text>
<line x1="310" y1="558" x2="370" y2="558" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="340.0" y="548" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">아니오</text>
<rect x="370" y="528.0" width="210" height="60" rx="6" fill="#125DE6"/>
<text x="475.0" y="542.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">원인 2</text>
<text x="475.0" y="558.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">DNS 캐시 만료 대기</text>
<text x="475.0" y="574.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">24시간 넘게 지속되면 원인 6</text>
<line x1="190" y1="608" x2="190" y2="648" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="202" y="628" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">예</text>
<!-- 판단 5 -->
<polygon points="190,648 310,690 190,732 70,690" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="190" y="682.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">인증서가</text>
<text x="190" y="698.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">만료되지 않았는가?</text>
<line x1="310" y1="690" x2="370" y2="690" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="340.0" y="680" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">아니오</text>
<rect x="370" y="668.0" width="210" height="44" rx="6" fill="#125DE6"/>
<text x="475.0" y="682.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">원인 4</text>
<text x="475.0" y="698.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">자동 갱신 조건 확인</text>
<line x1="190" y1="732" x2="190" y2="772" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="202" y="752" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">예</text>
<!-- 판단 6 -->
<polygon points="190,772 310,822 190,872 70,822" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="190" y="814.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">신규 발급 대기·발급 중이</text>
<text x="190" y="830.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">문의 기준 시간 이내인가?</text>
<line x1="310" y1="822" x2="370" y2="822" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="340.0" y="812" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">아니오</text>
<rect x="370" y="800.0" width="210" height="44" rx="6" fill="#125DE6"/>
<text x="475.0" y="814.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">원인 6</text>
<text x="475.0" y="830.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">고객 센터에 문의</text>
<line x1="190" y1="872" x2="190" y2="912" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="202" y="892" dominant-baseline="central" font-size="12" font-weight="bold" fill="#444444">예</text>
<!-- 안내 -->
<rect x="70" y="912" width="240" height="40" rx="6" fill="#646464"/>
<text x="190.0" y="932.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">문의 기준 시간까지 기다린 뒤 다시 확인</text>
<!-- 범례 -->
<line x1="70" y1="980" x2="580" y2="980" stroke="#DCDCDC" stroke-width="1"/>
<rect x="70" y="998" width="14" height="14" rx="3" fill="#646464"/>
<text x="90" y="1005" dominant-baseline="central" font-size="11" fill="#2D2D2D">증상</text>
<polygon points="160,998 175,1005 160,1012 145,1005" fill="#FFFFFF" stroke="#125DE6" stroke-width="1"/>
<text x="181" y="1005" dominant-baseline="central" font-size="11" fill="#2D2D2D">판단</text>
<rect x="230" y="998" width="14" height="14" rx="3" fill="#125DE6"/>
<text x="250" y="1005" dominant-baseline="central" font-size="11" fill="#2D2D2D">해결</text>
<rect x="300" y="998" width="14" height="14" rx="3" fill="#646464"/>
<text x="320" y="1005" dominant-baseline="central" font-size="11" fill="#2D2D2D">안내/이관</text>
<line x1="395" y1="1005" x2="420" y2="1005" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow-default)"/>
<text x="427" y="1005" dominant-baseline="central" font-size="11" fill="#2D2D2D">예/아니오</text>
</g>
</svg>
