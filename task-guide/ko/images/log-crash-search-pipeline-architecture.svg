<svg width="600" height="512" viewBox="0 0 600 512" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Log &amp; Crash Search 로그 수집 파이프라인 구성도</title>
<desc>여러 인스턴스의 Logstash가 애플리케이션 로그를 JSON으로 변환해 HTTPS로 Log &amp; Crash Search 수집 엔드포인트(/v2/log)에 전송합니다. 수집된 로그는 로그 검색 화면에서 Lucene 쿼리로 검색하고, 로그 알람이 조건을 감지하면 운영 담당자에게 이메일, SMS, 두레이 훅으로 알립니다.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10Z" fill="#8B8B8B"/>
  </marker>
  <style>
    text { font-family: 'Pretendard', sans-serif; }
    .title { font-size: 14px; font-weight: 700; fill: #125DE6; }
    .caption { font-size: 13px; fill: #2D2D2D; }
    .sub { font-size: 12px; fill: #8B8B8B; }
    .label { font-size: 12px; fill: #444444; }
    .node { font-size: 14px; font-weight: 600; fill: #FFFFFF; }
    .node-sub { font-size: 12px; fill: #FFFFFF; }
    .badge { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
  </style>
</defs>

<!-- 캔버스 배경 -->
<rect x="0" y="0" width="600" height="512" fill="#F7F7F7"/>

<!-- 콘텐츠 범위 x 30~570, y 30~482 → 상하좌우 여백 30 -->
<g transform="translate(0, 0)">

  <!-- ===== 인스턴스 영역 ===== -->
  <rect x="30" y="30" width="540" height="152" rx="8" fill="#E7F2FF"/>
  <text x="50" y="52" dominant-baseline="central" class="title">애플리케이션 인스턴스</text>

  <!-- 인스턴스 1 -->
  <circle cx="125" cy="100" r="22" fill="#FFFFFF"/>
  <g transform="translate(109, 84) scale(0.8)">
    <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
  </g>
  <text x="125" y="138" text-anchor="middle" dominant-baseline="central" class="caption">Instance</text>
  <text x="125" y="158" text-anchor="middle" dominant-baseline="central" class="sub">web-01 · Logstash</text>

  <!-- 인스턴스 2 -->
  <circle cx="300" cy="100" r="22" fill="#FFFFFF"/>
  <g transform="translate(284, 84) scale(0.8)">
    <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
  </g>
  <text x="300" y="138" text-anchor="middle" dominant-baseline="central" class="caption">Instance</text>
  <text x="300" y="158" text-anchor="middle" dominant-baseline="central" class="sub">web-02 · Logstash</text>

  <!-- 인스턴스 3 -->
  <circle cx="475" cy="100" r="22" fill="#FFFFFF"/>
  <g transform="translate(459, 84) scale(0.8)">
    <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
  </g>
  <text x="475" y="138" text-anchor="middle" dominant-baseline="central" class="caption">Instance</text>
  <text x="475" y="158" text-anchor="middle" dominant-baseline="central" class="sub">batch-01 · Logstash</text>

  <!-- ===== 전송 화살표 ===== -->
  <line x1="125" y1="184" x2="125" y2="228" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="184" x2="300" y2="228" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="184" x2="475" y2="228" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="171" cy="206" r="9" fill="#2D2D2D"/>
  <text x="171" y="206" text-anchor="middle" dominant-baseline="central" class="badge">1</text>
  <text x="185" y="206" dominant-baseline="central" class="label">JSON 로그 전송</text>
  <text x="387" y="206" text-anchor="middle" dominant-baseline="central" class="label">HTTPS POST /v2/log</text>

  <!-- ===== Log & Crash Search 영역 ===== -->
  <rect x="30" y="230" width="540" height="140" rx="8" fill="#E7F2FF"/>

  <circle cx="95" cy="290" r="26" fill="#FFFFFF"/>
  <g transform="translate(75, 270)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M21.725 6.73489C21.5492 6.43012 21.2962 6.17709 20.9914 6.00135C20.0346 5.44959 18.8116 5.77801 18.2598 6.73489L4.2674 31.0009C4.09222 31.3048 4 31.6493 4 32C4 33.1046 4.89543 34 6 34H33.9848C34.3355 34 34.68 33.9078 34.9838 33.7326C35.9407 33.1808 36.2691 31.9578 35.7174 31.0009L21.725 6.73489ZM17.9926 16V24H21.9926V16H17.9926ZM17.9926 30V26H21.9926V30H17.9926Z" fill="#125DE6"/>
  </g>
  <text x="95" y="334" text-anchor="middle" dominant-baseline="central" class="caption">Log &amp; Crash Search</text>

  <line x1="122" y1="290" x2="188" y2="290" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 로그 검색 -->
  <rect x="190" y="258" width="160" height="64" rx="6" fill="#125DE6"/>
  <circle cx="239" cy="280" r="9" fill="#2D2D2D"/>
  <text x="239" y="280" text-anchor="middle" dominant-baseline="central" class="badge">2</text>
  <text x="254" y="280" dominant-baseline="central" class="node">로그 검색</text>
  <text x="270" y="302" text-anchor="middle" dominant-baseline="central" class="node-sub">Lucene 쿼리 · 쿼리 저장</text>

  <line x1="352" y1="290" x2="378" y2="290" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 로그 알람 -->
  <rect x="380" y="258" width="160" height="64" rx="6" fill="#125DE6"/>
  <circle cx="429" cy="280" r="9" fill="#2D2D2D"/>
  <text x="429" y="280" text-anchor="middle" dominant-baseline="central" class="badge">3</text>
  <text x="444" y="280" dominant-baseline="central" class="node">로그 알람</text>
  <text x="460" y="302" text-anchor="middle" dominant-baseline="central" class="node-sub">발생수 · 임계치</text>

  <!-- ===== 알림 ===== -->
  <line x1="460" y1="324" x2="460" y2="404" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="448" y="388" text-anchor="end" dominant-baseline="central" class="label">이메일 · SMS · 두레이 훅</text>

  <circle cx="460" cy="432" r="26" fill="#FFFFFF"/>
  <g transform="translate(442.6, 414.6) scale(0.6)">
    <circle cx="29" cy="17" r="10" fill="#C8CCD4"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M50 50C50 37.2174 40.598 29 29 29C17.402 29 8 37.2174 8 50H50Z" fill="#C8CCD4"/>
  </g>
  <text x="460" y="474" text-anchor="middle" dominant-baseline="central" class="caption">운영 담당자</text>

</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
