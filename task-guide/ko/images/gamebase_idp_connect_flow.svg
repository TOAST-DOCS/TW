<svg viewBox="0 0 1340 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1340" height="320" fill="#FCFCFC"/>

  <text x="670" y="34" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#191919">Google IdP 연동 흐름</text>

  <!-- Card 1: Google Cloud Console -->
  <g>
    <rect x="40" y="70" width="240" height="130" rx="12" fill="#FFFFFF"/>
    <path d="M 40 82 Q 40 70 52 70 L 268 70 Q 280 70 280 82 L 280 114 L 40 114 Z" fill="#0F80F6"/>
    <text x="160" y="97" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Google Cloud Console</text>
    <text x="160" y="150" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="500" fill="#191919">OAuth 클라이언트 발급</text>
    <text x="160" y="175" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#646464">Android · iOS · Web</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="280" y1="135" x2="366" y2="135" stroke="#0157B1" stroke-width="2.5"/>
  <polygon points="380,135 366,128 366,142" fill="#0157B1"/>
  <text x="330" y="118" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">Client ID, Secret</text>

  <!-- Card 2: Gamebase 콘솔 (등록) -->
  <g>
    <rect x="380" y="70" width="240" height="130" rx="12" fill="#FFFFFF"/>
    <path d="M 380 82 Q 380 70 392 70 L 608 70 Q 620 70 620 82 L 620 114 L 380 114 Z" fill="#054283"/>
    <text x="500" y="97" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Gamebase 콘솔</text>
    <text x="500" y="150" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="500" fill="#191919">인증 정보 등록</text>
    <text x="500" y="175" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#646464">Client ID / Secret Key 저장</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="620" y1="135" x2="706" y2="135" stroke="#0157B1" stroke-width="2.5"/>
  <polygon points="720,135 706,128 706,142" fill="#0157B1"/>
  <text x="670" y="118" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">설정 완료</text>

  <!-- Card 3: Unity SDK -->
  <g>
    <rect x="720" y="70" width="240" height="130" rx="12" fill="#FFFFFF"/>
    <path d="M 720 82 Q 720 70 732 70 L 948 70 Q 960 70 960 82 L 960 114 L 720 114 Z" fill="#64748B"/>
    <text x="840" y="97" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Unity SDK</text>
    <text x="840" y="150" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="500" fill="#191919">로그인 API 호출</text>
    <text x="840" y="175" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#646464">Gamebase.Login()</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="960" y1="135" x2="1046" y2="135" stroke="#0157B1" stroke-width="2.5"/>
  <polygon points="1060,135 1046,128 1046,142" fill="#0157B1"/>
  <text x="1010" y="118" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="12" fill="#646464">로그인 성공</text>

  <!-- Card 4: Gamebase 콘솔 (확인) -->
  <g>
    <rect x="1060" y="70" width="240" height="130" rx="12" fill="#FFFFFF"/>
    <path d="M 1060 82 Q 1060 70 1072 70 L 1288 70 Q 1300 70 1300 82 L 1300 114 L 1060 114 Z" fill="#054283"/>
    <text x="1180" y="97" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Gamebase 콘솔</text>
    <text x="1180" y="150" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="500" fill="#191919">멤버 조회로 확인</text>
    <text x="1180" y="175" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#646464">멤버 &gt; userId 검색</text>
  </g>
</svg>
