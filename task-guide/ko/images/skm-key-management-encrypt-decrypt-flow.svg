<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Pretendard', sans-serif">
  <rect width="600" height="440" rx="12" fill="#F7F7F7"/>

  <g transform="translate(0, 10)">
    <!-- ===== 상단 참가자 ===== -->
    <!-- 클라이언트 -->
    <circle cx="110" cy="50" r="30" fill="#FFFFFF"/>
    <g transform="translate(93.6, 33.6) scale(0.6)">
      <circle cx="29" cy="17" r="10" fill="#C8CCD4"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M50 50C50 37.2174 40.598 29 29 29C17.402 29 8 37.2174 8 50H50Z" fill="#C8CCD4"/>
    </g>
    <text x="110" y="98" text-anchor="middle" fill="#2D2D2D" font-size="13" font-weight="600">클라이언트</text>

    <!-- Secure Key Manager -->
    <circle cx="480" cy="50" r="30" fill="#FFFFFF"/>
    <g transform="translate(462, 32)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M36 20C36 24.4183 32.4183 28 28 28C24.2723 28 21.1401 25.4505 20.252 22H16V26H12V22H8V26H4V22V18H8H12H16H20.252C21.1401 14.5495 24.2723 12 28 12C32.4183 12 36 15.5817 36 20ZM32 20C32 22.2091 30.2091 24 28 24C25.7909 24 24 22.2091 24 20C24 17.7909 25.7909 16 28 16C30.2091 16 32 17.7909 32 20Z" fill="#125DE6"/>
    </g>
    <text x="480" y="98" text-anchor="middle" fill="#2D2D2D" font-size="12" font-weight="600">Secure Key Manager</text>

    <!-- ===== 라이프라인 ===== -->
    <line x1="110" y1="108" x2="110" y2="390" stroke="#DCDCDC" stroke-width="1" />
    <line x1="480" y1="108" x2="480" y2="390" stroke="#DCDCDC" stroke-width="1" />

    <!-- ===== Step 1: 암호화 요청 (→) ===== -->
    <rect x="192" y="129" width="18" height="18" rx="9" fill="#2D2D2D"/>
    <text x="201" y="142" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1</text>
    <text x="216" y="142" fill="#444444" font-size="12">대칭 키로 암호화 요청 (plaintext)</text>
    <line x1="110" y1="160" x2="472" y2="160" stroke="#8B8B8B" stroke-width="1.5"/>
    <polygon points="472,156.5 480,160 472,163.5" fill="#8B8B8B"/>

    <!-- ===== Step 2: 암호문 반환 (← dashed) ===== -->
    <rect x="218" y="199" width="18" height="18" rx="9" fill="#2D2D2D"/>
    <text x="227" y="212" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">2</text>
    <text x="242" y="212" fill="#444444" font-size="12">암호문 반환 (ciphertext)</text>
    <line x1="480" y1="230" x2="118" y2="230" stroke="#8B8B8B" stroke-width="1.5" />
    <polygon points="118,226.5 110,230 118,233.5" fill="#8B8B8B"/>

    <!-- ===== Step 3: 복호화 요청 (→) ===== -->
    <rect x="222" y="269" width="18" height="18" rx="9" fill="#2D2D2D"/>
    <text x="231" y="282" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">3</text>
    <text x="246" y="282" fill="#444444" font-size="12">복호화 요청 (ciphertext)</text>
    <line x1="110" y1="300" x2="472" y2="300" stroke="#8B8B8B" stroke-width="1.5"/>
    <polygon points="472,296.5 480,300 472,303.5" fill="#8B8B8B"/>

    <!-- ===== Step 4: 평문 반환 (← dashed) ===== -->
    <rect x="226" y="339" width="18" height="18" rx="9" fill="#2D2D2D"/>
    <text x="235" y="352" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">4</text>
    <text x="250" y="352" fill="#444444" font-size="12">평문 반환 (plaintext)</text>
    <line x1="480" y1="370" x2="118" y2="370" stroke="#8B8B8B" stroke-width="1.5" />
    <polygon points="118,366.5 110,370 118,373.5" fill="#8B8B8B"/>

    <!-- ===== 하단 라벨 ===== -->
    <text x="110" y="410" text-anchor="middle" fill="#2D2D2D" font-size="13" font-weight="600">클라이언트</text>
    <text x="480" y="410" text-anchor="middle" fill="#2D2D2D" font-size="12" font-weight="600">Secure Key Manager</text>
  </g>
</svg>
