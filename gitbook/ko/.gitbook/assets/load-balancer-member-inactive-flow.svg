<svg width="810" height="940" viewBox="0 0 810 940" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Load Balancer 멤버 INACTIVE 원인 판단 흐름</title>
<desc>멤버 상태가 INACTIVE일 때 보안 그룹, IP 접근 제어 그룹, 서비스 실행 상태, 상태 확인 설정, 응답 시간을 차례로 확인합니다. 각 질문에서 아니오이면 원인 1부터 원인 5로, 모두 예이면 원인 6(멤버 등록 포트 불일치)으로 이어집니다.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#8B8B8B"/>
  </marker>
</defs>

<style>
  text { font-family: 'Pretendard', sans-serif; }
</style>

<!-- 캔버스 배경 -->
<rect x="0" y="0" width="810" height="940" fill="#F7F7F7"/>

<!-- 시작: 멤버 상태 INACTIVE -->
<rect x="140" y="40" width="240" height="48" rx="6" fill="#646464"/>
<text x="260" y="64" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">멤버 상태가 INACTIVE</text>
<path d="M260 88L260 124" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>


<!-- 질문 1 -->
<polygon points="260,124 430,180 260,236 90,180" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="260" y="163" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">멤버의 보안 그룹이</text>
<text x="260" y="180" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">Load Balancer 트래픽을</text>
<text x="260" y="197" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">허용하는가?</text>
<path d="M430 180L520 180" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">아니오</text>
<rect x="520" y="144" width="200" height="72" rx="6" fill="#125DE6"/>
<text x="620" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#FFFFFF">원인 1</text>
<text x="620" y="192" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">보안 그룹이 트래픽 차단</text>
<path d="M260 236L260 264" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="272" y="250" dominant-baseline="central" font-size="12" fill="#444444">예</text>

<!-- 질문 2 -->
<polygon points="260,264 430,320 260,376 90,320" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="260" y="303" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">Load Balancer의</text>
<text x="260" y="320" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">IP 접근 제어 그룹이</text>
<text x="260" y="337" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">멤버 IP를 허용하는가?</text>
<path d="M430 320L520 320" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">아니오</text>
<rect x="520" y="284" width="200" height="72" rx="6" fill="#125DE6"/>
<text x="620" y="303" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#FFFFFF">원인 2</text>
<text x="620" y="325" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">IP 접근 제어 그룹이</text>
<text x="620" y="342" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">멤버 IP 차단</text>
<path d="M260 376L260 404" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="272" y="390" dominant-baseline="central" font-size="12" fill="#444444">예</text>

<!-- 질문 3 -->
<polygon points="260,404 430,460 260,516 90,460" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="260" y="443" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">멤버에서 서비스가</text>
<text x="260" y="460" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">실행 중이고 포트가</text>
<text x="260" y="477" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">열려 있는가?</text>
<path d="M430 460L520 460" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="448" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">아니오</text>
<rect x="520" y="424" width="200" height="72" rx="6" fill="#125DE6"/>
<text x="620" y="448" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#FFFFFF">원인 3</text>
<text x="620" y="472" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">서비스 비정상</text>
<path d="M260 516L260 544" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="272" y="530" dominant-baseline="central" font-size="12" fill="#444444">예</text>

<!-- 질문 4 -->
<polygon points="260,544 430,600 260,656 90,600" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="260" y="583" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">상태 확인 설정이</text>
<text x="260" y="600" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">(프로토콜, 포트, URL, 상태 코드)</text>
<text x="260" y="617" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">실제 서비스와 일치하는가?</text>
<path d="M430 600L520 600" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="588" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">아니오</text>
<rect x="520" y="564" width="200" height="72" rx="6" fill="#125DE6"/>
<text x="620" y="588" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#FFFFFF">원인 4</text>
<text x="620" y="612" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">상태 확인 설정 불일치</text>
<path d="M260 656L260 684" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="272" y="670" dominant-baseline="central" font-size="12" fill="#444444">예</text>

<!-- 질문 5 -->
<polygon points="260,684 430,740 260,796 90,740" fill="#FFFFFF" stroke="#125DE6" stroke-width="1.5"/>
<text x="260" y="723" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">서비스 응답이</text>
<text x="260" y="740" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">최대 응답 대기 시간</text>
<text x="260" y="757" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2D2D2D">안에 오는가?</text>
<path d="M430 740L520 740" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="728" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">아니오</text>
<rect x="520" y="704" width="200" height="72" rx="6" fill="#125DE6"/>
<text x="620" y="728" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#FFFFFF">원인 5</text>
<text x="620" y="752" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">응답 시간 초과</text>
<path d="M260 796L260 836" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="272" y="816" dominant-baseline="central" font-size="12" fill="#444444">예</text>

<!-- 원인 6 (모두 예) -->
<rect x="140" y="836" width="240" height="64" rx="6" fill="#125DE6"/>
<text x="260" y="856" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#FFFFFF">원인 6</text>
<text x="260" y="880" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">멤버 등록 포트 불일치</text>

</svg>
