<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="'Pretendard', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">인스턴스 생성 실패 원인 판단 흐름</title>
  <desc id="desc">쿼터 부족, 개인 이미지 사용, 가용량 부족 오류 메시지 순서로 확인해 원인 1부터 원인 4까지 좁히는 흐름입니다.</desc>
  <rect width="920" height="580" rx="12" fill="#F7F7F7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B8B8B"/>
    </marker>
  </defs>

  <!-- ===== 증상 (상위 제목 바) ===== -->
  <rect x="100" y="40" width="300" height="48" rx="6" fill="#003087"/>
  <text x="250" y="69" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">증상: 인스턴스 생성 실패</text>

  <!-- ===== 판단 노드 (외곽선 노드) ===== -->
  <g fill="none" stroke="#125DE6" stroke-width="1.5">
    <rect x="100" y="132" width="300" height="52" rx="6"/>
    <rect x="100" y="256" width="300" height="52" rx="6"/>
    <rect x="100" y="380" width="300" height="52" rx="6"/>
  </g>
  <g font-size="13" font-weight="600" fill="#125DE6" text-anchor="middle">
    <text x="250" y="163">쿼터가 부족한가?</text>
    <text x="250" y="287">개인 이미지를 사용했는가?</text>
    <text x="250" y="411">오류 메시지가 가용량 부족인가?</text>
  </g>

  <!-- ===== 아니오: 세로 흐름 ===== -->
  <g stroke="#8B8B8B" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="250" y1="88" x2="250" y2="130"/>
    <line x1="250" y1="184" x2="250" y2="254"/>
    <line x1="250" y1="308" x2="250" y2="378"/>
    <line x1="250" y1="432" x2="250" y2="502"/>
  </g>
  <g font-size="11" fill="#444444">
    <text x="260" y="224">아니오</text>
    <text x="260" y="348">아니오</text>
    <text x="260" y="472">아니오</text>
  </g>

  <!-- ===== 예: 가로 분기 ===== -->
  <g stroke="#8B8B8B" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="400" y1="158" x2="498" y2="158"/>
    <line x1="400" y1="282" x2="498" y2="282"/>
    <line x1="400" y1="406" x2="498" y2="406"/>
  </g>
  <g font-size="11" fill="#444444" text-anchor="middle">
    <text x="449" y="150">예</text>
    <text x="449" y="274">예</text>
    <text x="449" y="398">예</text>
  </g>

  <!-- ===== 결과 노드 ===== -->
  <g fill="#E7F2FF">
    <rect x="500" y="132" width="380" height="52" rx="6"/>
    <rect x="500" y="256" width="380" height="52" rx="6"/>
    <rect x="500" y="380" width="380" height="52" rx="6"/>
    <rect x="100" y="504" width="300" height="52" rx="6"/>
  </g>
  <g font-size="13" fill="#2D2D2D">
    <text x="520" y="163"><tspan font-weight="700" fill="#125DE6">원인 1</tspan><tspan dx="10">리소스 정리 또는 쿼터 조정 신청</tspan></text>
    <text x="520" y="287"><tspan font-weight="700" fill="#125DE6">원인 2</tspan><tspan dx="10">이미지 크기와 속성 확인</tspan></text>
    <text x="520" y="411"><tspan font-weight="700" fill="#125DE6">원인 3</tspan><tspan dx="10">가용성 영역 또는 타입 변경, 문의</tspan></text>
    <text x="250" y="535" text-anchor="middle"><tspan font-weight="700" fill="#125DE6">원인 4</tspan><tspan dx="10">삭제 후 재생성, 반복되면 문의</tspan></text>
  </g>
</svg>
