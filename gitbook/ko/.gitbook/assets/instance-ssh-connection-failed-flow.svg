<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="'Pretendard', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">SSH 접속 실패 원인 판단 흐름</title>
  <desc id="desc">오류 메시지 유형으로 먼저 나누고, 키페어와 계정 일치 여부와 인스턴스 부팅 상태를 확인해 원인 1부터 원인 4까지 좁히는 흐름입니다.</desc>
  <rect width="1040" height="640" rx="12" fill="#F7F7F7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B8B8B"/>
    </marker>
  </defs>

  <!-- ===== 증상 (상위 제목 바) ===== -->
  <rect x="370" y="40" width="300" height="48" rx="6" fill="#003087"/>
  <text x="520" y="69" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">증상: SSH 접속 실패</text>

  <!-- ===== 판단 노드 (외곽선 노드) ===== -->
  <g fill="none" stroke="#125DE6" stroke-width="1.5">
    <rect x="370" y="128" width="300" height="52" rx="6"/>
    <rect x="370" y="260" width="300" height="52" rx="6"/>
    <rect x="710" y="260" width="300" height="52" rx="6"/>
  </g>
  <g font-size="13" font-weight="600" fill="#125DE6" text-anchor="middle">
    <text x="520" y="159">오류 메시지 유형</text>
    <text x="520" y="291">키페어와 계정이 맞는가?</text>
    <text x="860" y="291">인스턴스가 정상 부팅됐는가?</text>
  </g>

  <!-- 증상 → 판단 -->
  <line x1="520" y1="88" x2="520" y2="126" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 오류 메시지 유형 분기 ===== -->
  <g stroke="#8B8B8B" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 370 154 L 170 154 L 170 258"/>
    <line x1="520" y1="180" x2="520" y2="258"/>
    <path d="M 670 154 L 860 154 L 860 258"/>
  </g>
  <g font-size="11" fill="#444444" text-anchor="middle">
    <text x="275" y="146">Connection timed out</text>
    <text x="765" y="146">Connection refused</text>
  </g>
  <text x="530" y="224" fill="#444444" font-size="11">Permission denied</text>

  <!-- ===== 예: 원인 3으로 수렴 ===== -->
  <g stroke="#8B8B8B" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 370 286 L 340 286 L 340 545 L 368 545"/>
    <path d="M 710 286 L 690 286 L 690 563 L 672 563"/>
  </g>
  <text x="355" y="278" text-anchor="middle" fill="#444444" font-size="11">예</text>
  <text x="698" y="342" fill="#444444" font-size="11">예</text>

  <!-- ===== 아니오: 개별 원인으로 ===== -->
  <g stroke="#8B8B8B" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="520" y1="312" x2="520" y2="390"/>
    <line x1="860" y1="312" x2="860" y2="390"/>
    <path d="M 170 312 L 170 570 L 368 570"/>
  </g>
  <g font-size="11" fill="#444444">
    <text x="530" y="356">아니오</text>
    <text x="870" y="356">아니오</text>
    <text x="180" y="440">경로를 모두 열어도 실패</text>
  </g>

  <!-- ===== 결과 노드 ===== -->
  <g fill="#E7F2FF">
    <rect x="30" y="260" width="280" height="52" rx="6"/>
    <rect x="370" y="392" width="300" height="52" rx="6"/>
    <rect x="710" y="392" width="300" height="52" rx="6"/>
    <rect x="370" y="532" width="300" height="52" rx="6"/>
  </g>
  <g font-size="13" fill="#2D2D2D" text-anchor="middle">
    <text x="170" y="291"><tspan font-weight="700" fill="#125DE6">원인 1</tspan><tspan dx="10">접속 경로 미도달</tspan></text>
    <text x="520" y="423"><tspan font-weight="700" fill="#125DE6">원인 2</tspan><tspan dx="10">키페어 불일치</tspan></text>
    <text x="860" y="423"><tspan font-weight="700" fill="#125DE6">원인 4</tspan><tspan dx="10">부팅 실패</tspan></text>
    <text x="520" y="563"><tspan font-weight="700" fill="#125DE6">원인 3</tspan><tspan dx="10">OS 내부 SSH 차단</tspan></text>
  </g>
</svg>
