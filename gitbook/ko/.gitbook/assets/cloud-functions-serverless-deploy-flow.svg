<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Pretendard', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">클라이언트 요청이 Cloud Functions의 함수 엔드포인트를 거쳐 함수 인스턴스에서 실행되는 구성</title>
  <desc id="desc">클라이언트가 HTTPS로 함수 엔드포인트를 호출하면 Pool Manager 유형은 그때 함수 인스턴스를 만들고, 인스턴스가 코드를 실행한 결과가 엔드포인트를 거쳐 클라이언트에 응답으로 돌아갑니다. 호출이 없으면 인스턴스가 제거되어 리소스 사용량이 0이 됩니다.</desc>
  <rect width="960" height="400" rx="12" fill="#F7F7F7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B8B8B"/>
    </marker>
  </defs>

  <!-- ===== 클라이언트 (외부, cx=90, cy=182) ===== -->
  <circle cx="90" cy="182" r="32" fill="#FFFFFF"/>
  <g transform="translate(72.6, 164.6) scale(0.6)">
    <circle cx="29" cy="17" r="10" fill="#C8CCD4"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M50 50C50 37.2174 40.598 29 29 29C17.402 29 8 37.2174 8 50H50Z" fill="#C8CCD4"/>
  </g>
  <text x="90" y="240" text-anchor="middle" fill="#2D2D2D" font-size="13" font-weight="600">클라이언트</text>

  <!-- ===== NHN Cloud 영역 ===== -->
  <rect x="200" y="40" width="720" height="320" rx="8" fill="#E7F2FF"/>
  <text x="216" y="62" fill="#125DE6" font-size="13" font-weight="700">NHN Cloud</text>

  <!-- ===== Cloud Functions 컨테이너 ===== -->
  <rect x="230" y="84" width="660" height="250" rx="8" fill="#FFFFFF"/>
  <g transform="translate(244, 94) scale(0.5)">
    <path d="M30 22C34.4183 22 38 25.5817 38 30C38 34.4183 34.4183 38 30 38C25.5817 38 22 34.4183 22 30C22 25.5817 25.5817 22 30 22ZM32 4C34.2091 4 35.9999 5.79097 36 8V21.999C34.3287 20.7437 32.2512 20 30 20C24.4772 20 20.0001 24.4773 20 30C20.0001 32.2511 20.7437 34.3288 21.999 36H8C5.79094 36 4.00013 34.209 4 32V8C4.00013 5.79097 5.79094 4 8 4H32ZM27 34L34 30L27 26V34ZM23.9482 16.0684C21.8847 16.0211 19.8396 16.7607 18.3018 18.2979C16.7626 19.8365 16.0225 21.8835 16.0713 23.9482L18.29 24C18.2545 22.5028 18.7911 21.018 19.9072 19.9023C21.0219 18.7882 22.5043 18.252 24 18.2861L23.9482 16.0684ZM23.8545 12.0361C20.7586 11.9648 17.6899 13.0737 15.3828 15.3799C13.0743 17.6875 11.9653 20.7578 12.0381 23.8545L14.2568 23.9062C14.1973 21.3772 15.1031 18.87 16.9883 16.9854C18.8723 15.1021 21.3781 14.1958 23.9062 14.2539L23.8545 12.0361ZM23.7607 8.00391C19.6326 7.90852 15.5412 9.38768 12.4648 12.4629C9.3871 15.5396 7.90807 19.6321 8.00488 23.7607L10.2227 23.8115C10.1392 20.2507 11.4149 16.721 14.0693 14.0674C16.7226 11.4151 20.2521 10.1395 23.8125 10.2217L23.7607 8.00391Z" fill="#125DE6"/>
  </g>
  <text x="270" y="109" fill="#125DE6" font-size="13" font-weight="700">Cloud Functions</text>
  <text x="380" y="109" fill="#8B8B8B" font-size="11">Pool Manager 유형</text>

  <!-- 함수 엔드포인트 (cx=360, cy=182) -->
  <rect x="260" y="152" width="200" height="60" rx="6" fill="#125DE6"/>
  <text x="360" y="177" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">함수 엔드포인트</text>
  <text x="360" y="196" text-anchor="middle" fill="#FFFFFF" font-size="10">함수 이름으로 정해지는 HTTPS 주소</text>

  <!-- 함수 인스턴스 (cx=740, cy=182) -->
  <rect x="640" y="152" width="200" height="60" rx="6" fill="#125DE6"/>
  <text x="740" y="177" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">함수 인스턴스</text>
  <text x="740" y="196" text-anchor="middle" fill="#FFFFFF" font-size="10">코드를 실행하고 응답을 반환</text>

  <!-- 인스턴스 제거 (cx=740, cy=290) -->
  <rect x="640" y="266" width="200" height="50" rx="6" fill="#F7F7F7"/>
  <text x="740" y="287" text-anchor="middle" fill="#2D2D2D" font-size="12" font-weight="600">인스턴스 제거</text>
  <text x="740" y="304" text-anchor="middle" fill="#8B8B8B" font-size="10">리소스 사용량 0</text>

  <!-- ===== ① 클라이언트 → 엔드포인트: HTTPS 요청 (실선) ===== -->
  <line x1="122" y1="170" x2="258" y2="170" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="138" y="144" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="147" y="157" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1</text>
  <text x="160" y="157" fill="#444444" font-size="11">HTTPS 요청</text>

  <!-- ===== ② 엔드포인트 → 인스턴스: 호출 시 생성 (실선) ===== -->
  <line x1="460" y1="170" x2="638" y2="170" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="508" y="144" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="517" y="157" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">2</text>
  <text x="530" y="157" fill="#444444" font-size="11">호출 시 생성</text>

  <!-- ===== ③ 인스턴스 → 엔드포인트: 실행 결과 (응답, 점선) ===== -->
  <line x1="640" y1="196" x2="462" y2="196" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="514" y="206" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="523" y="219" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">3</text>
  <text x="536" y="219" fill="#444444" font-size="11">실행 결과</text>

  <!-- ===== ④ 엔드포인트 → 클라이언트: 응답 반환 (응답, 점선) ===== -->
  <line x1="260" y1="196" x2="124" y2="196" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="138" y="206" width="18" height="18" rx="9" fill="#2D2D2D"/>
  <text x="147" y="219" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">4</text>
  <text x="160" y="219" fill="#444444" font-size="11">응답 반환</text>

  <!-- ===== 인스턴스 → 제거: 호출이 없으면 (보조, 점선) ===== -->
  <line x1="740" y1="212" x2="740" y2="264" stroke="#8B8B8B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="750" y="242" fill="#444444" font-size="11">호출이 없으면</text>
</svg>
