<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>NAT Gateway 트래픽 흐름</title>
<desc>퍼블릭 서브넷에 NAT Gateway를 생성하고, 프라이빗 서브넷의 라우팅 테이블에 0.0.0.0/0 경로를 NAT Gateway로 추가합니다. 프라이빗 서브넷의 인스턴스가 보낸 트래픽은 NAT Gateway에서 발신지 IP가 플로팅 IP로 변환되어 Internet Gateway를 거쳐 인터넷으로 나갑니다. 외부에서 NAT Gateway의 플로팅 IP로 시작하는 인바운드 연결은 차단됩니다.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#8B8B8B"/>
  </marker>
</defs>

<style>
  text { font-family: 'Pretendard', sans-serif; }
</style>

<!-- 캔버스 배경 -->
<rect x="0" y="0" width="1000" height="420" fill="#F7F7F7"/>

<!-- NHN Cloud 그룹 컨테이너 -->
<rect x="40" y="30" width="740" height="360" rx="8" fill="#E7F2FF"/>
<text x="410" y="54" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#125DE6">NHN Cloud</text>

<!-- VPC 그룹 박스 -->
<rect x="60" y="76" width="580" height="294" rx="8" fill="#FFFFFF"/>
<text x="80" y="96" dominant-baseline="central" font-size="13" font-weight="700" fill="#125DE6">VPC</text>

<!-- 프라이빗 서브넷 -->
<rect x="80" y="112" width="250" height="238" rx="6" fill="#F7F7F7"/>
<text x="205" y="134" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2D2D2D">프라이빗 서브넷</text>

<!-- 퍼블릭 서브넷 -->
<rect x="390" y="112" width="230" height="238" rx="6" fill="#F7F7F7"/>
<text x="505" y="134" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2D2D2D">퍼블릭 서브넷</text>

<!-- Instance (서비스 아이콘) -->
<circle cx="205" cy="225" r="34" fill="#FFFFFF"/>
<g transform="translate(187, 207) scale(0.9)">
  <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
</g>
<text x="205" y="277" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2D2D2D">Instance</text>

<!-- NAT Gateway (서비스 아이콘) -->
<circle cx="505" cy="225" r="34" fill="#FFFFFF"/>
<g transform="translate(487, 207) scale(0.9)">
  <path fill-rule="evenodd" clip-rule="evenodd" d="M2 5C2 3.34315 3.34315 2 5 2C6.65685 2 8 3.34315 8 5C8 5.46315 7.89505 5.90178 7.70763 6.29342L9.41538 8.00117C12.2361 5.51102 15.9416 4 20 4C24.0573 4 27.7618 5.51017 30.5822 7.99907L32.2909 6.29039C32.1044 5.89952 32 5.46196 32 5C32 3.34315 33.3431 2 35 2C36.6569 2 38 3.34315 38 5C38 6.65685 36.6569 8 35 8C34.5357 8 34.096 7.89451 33.7036 7.70618L31.9967 9.41301C34.4881 12.234 36 15.9404 36 20C36 24.0593 34.4883 27.7656 31.9972 30.5865L33.7042 32.2935C34.0964 32.1054 34.5359 32 35 32C36.6569 32 38 33.3431 38 35C38 36.6569 36.6569 38 35 38C33.3431 38 32 36.6569 32 35C32 34.5378 32.1045 34.1 32.2912 33.709L30.5827 32.0005C27.7623 34.4897 24.0575 36 20 36C15.9402 36 12.2336 34.488 9.41252 31.9963L7.70589 33.7029C7.8944 34.0955 8 34.5354 8 35C8 36.6569 6.65685 38 5 38C3.34315 38 2 36.6569 2 35C2 33.3431 3.34315 32 5 32C5.46171 32 5.89906 32.1043 6.28978 32.2906L7.99864 30.5818C5.51 27.7614 4 24.057 4 20C4 15.9416 5.51102 12.2361 8.00117 9.41538L6.29342 7.70763C5.90178 7.89505 5.46315 8 5 8C3.34315 8 2 6.65685 2 5ZM20 7.2C12.9308 7.2 7.2 12.9308 7.2 20C7.2 27.0692 12.9308 32.8 20 32.8C27.0692 32.8 32.8 27.0692 32.8 20C32.8 12.9308 27.0692 7.2 20 7.2ZM14.5 12.5C16.433 12.5 18 14.067 18 16C18 17.933 16.433 19.5 14.5 19.5C12.567 19.5 11 17.933 11 16C11 14.067 12.567 12.5 14.5 12.5ZM14.5 14.5C13.6716 14.5 13 15.1716 13 16C13 16.8284 13.6716 17.5 14.5 17.5C15.3284 17.5 16 16.8284 16 16C16 15.1716 15.3284 14.5 14.5 14.5ZM30.5 20C30.5 18.067 28.933 16.5 27 16.5C25.4235 16.5 24.0904 17.5424 23.6523 18.9755L20.9698 19.0399L21.0302 21.039L23.638 20.9764C24.0607 22.4343 25.4059 23.5 27 23.5C28.933 23.5 30.5 21.933 30.5 20ZM25.5 20C25.5 19.1716 26.1716 18.5 27 18.5C27.8284 18.5 28.5 19.1716 28.5 20C28.5 20.8284 27.8284 21.5 27 21.5C26.1716 21.5 25.5 20.8284 25.5 20ZM18 24C18 22.067 16.433 20.5 14.5 20.5C12.567 20.5 11 22.067 11 24C11 25.933 12.567 27.5 14.5 27.5C16.433 27.5 18 25.933 18 24ZM13 24C13 23.1716 13.6716 22.5 14.5 22.5C15.3284 22.5 16 23.1716 16 24C16 24.8284 15.3284 25.5 14.5 25.5C13.6716 25.5 13 24.8284 13 24Z" fill="#125DE6"/>
  <mask id="natMask" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="17" y="13" width="6" height="13">
    <rect x="17" y="13" width="6" height="13" fill="white"/>
  </mask>
  <g mask="url(#natMask)">
    <rect x="12" y="16" width="9" height="8" rx="1" fill="none" stroke="#125DE6" stroke-width="2"/>
  </g>
</g>
<text x="505" y="277" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2D2D2D">NAT Gateway</text>
<text x="505" y="295" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#8B8B8B">(플로팅 IP 할당)</text>

