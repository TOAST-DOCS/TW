<text x="710" y="277" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2D2D2D">Internet Gateway</text>

<!-- 인터넷 (외부) -->
<rect x="840" y="201" width="120" height="48" rx="6" fill="#646464"/>
<text x="900" y="225" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFFFFF">인터넷</text>

<!-- 주 흐름: Instance -> NAT Gateway (2 라우트 0.0.0.0/0) -->
<path d="M239 225L471 225" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="264" cy="205" r="9" fill="#2D2D2D"/>
<text x="264" y="205" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
<text x="279" y="205" dominant-baseline="central" font-size="12" fill="#444444">라우트 0.0.0.0/0</text>

<!-- 단계 번호: 1 NAT Gateway 생성 -->
<circle cx="471" cy="193" r="9" fill="#2D2D2D"/>
<text x="471" y="193" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
<text x="456" y="193" text-anchor="end" dominant-baseline="central" font-size="12" fill="#444444">생성</text>

<!-- 주 흐름: NAT Gateway -> Internet Gateway (플로팅 IP로 변환) -->
<path d="M539 225L676 225" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="607" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444444">플로팅 IP로 변환</text>

<!-- 주 흐름: Internet Gateway -> 인터넷 -->
<path d="M744 225L840 225" fill="none" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 보조 흐름: 인터넷 -> NAT Gateway 인바운드 (차단) -->
<path d="M900 201L900 160L520 160" fill="none" stroke="#8B8B8B" stroke-width="1.5" stroke-dasharray="6,4"/>
<circle cx="511" cy="160" r="9" fill="#2D2D2D"/>
<path d="M507 156L515 164M515 156L507 164" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
<text x="900" y="148" text-anchor="end" dominant-baseline="central" font-size="12" fill="#444444">인바운드 연결 차단</text>

</svg>
