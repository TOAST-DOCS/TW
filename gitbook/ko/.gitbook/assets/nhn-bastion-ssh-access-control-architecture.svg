<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Pretendard', sans-serif">
  <rect width="960" height="480" rx="12" fill="#F7F7F7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B8B8B"/>
    </marker>
  </defs>

  <g transform="translate(-20, 30)">
    <!-- ===== NHN Cloud 영역 ===== -->
    <rect x="300" y="16" width="620" height="430" rx="8" fill="#E7F2FF" opacity="0.4"/>
    <text x="610" y="40" text-anchor="middle" fill="#125DE6" font-size="13" font-weight="700">NHN Cloud</text>

    <!-- ===== 사용자 (cx=110, cy=120) ===== -->
    <circle cx="110" cy="120" r="32" fill="#FFFFFF"/>
    <g transform="translate(92.6, 102.6) scale(0.6)">
      <circle cx="29" cy="17" r="10" fill="#C8CCD4"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M50 50C50 37.2174 40.598 29 29 29C17.402 29 8 37.2174 8 50H50Z" fill="#C8CCD4"/>
    </g>
    <text x="110" y="170" text-anchor="middle" fill="#2D2D2D" font-size="13" font-weight="600">사용자</text>
    <text x="110" y="186" text-anchor="middle" fill="#8B8B8B" font-size="11">(브라우저)</text>

    <!-- ===== IP 접근 제어 (center x=270, cy=120) ===== -->
    <rect x="220" y="106" width="100" height="28" rx="6" fill="none" stroke="#125DE6" stroke-width="1.5"/>
    <text x="270" y="125" text-anchor="middle" fill="#125DE6" font-size="11" font-weight="600">IP 접근 제어</text>

    <line x1="142" y1="120" x2="218" y2="120" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="322" y1="120" x2="438" y2="120" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- ===== NHN Bastion (cx=480, cy=120) ===== -->
    <circle cx="480" cy="120" r="36" fill="#FFFFFF"/>
    <g transform="translate(460, 100)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M8 6C6.89543 6 6 6.89543 6 8V16C6 17.1046 6.89543 18 8 18H18L17.6667 16H34V8C34 6.89543 33.1046 6 32 6H8ZM18.6667 22L19.3334 26H20.9999V28.5359C20.3316 28.9218 19.7877 29.4937 19.436 30.184C19.1594 30.7269 19.0713 31.2664 19.0339 31.7235C18.9999 32.1399 18.9999 32.6314 19 33.1362V33.1362L19 33.2V34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H18.6667ZM22 10V14H30V10H22Z" fill="#125DE6"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M20 18L21 24H23V30.0192C22.6078 30.0431 22.3295 30.097 22.092 30.218C21.7157 30.4097 21.4097 30.7157 21.218 31.092C21 31.5198 21 32.0799 21 33.2V34H23H33H35V33.2C35 32.0799 35 31.5198 34.782 31.092C34.5903 30.7157 34.2843 30.4097 33.908 30.218C33.6705 30.097 33.3922 30.0431 33 30.0192V24H35L36 18H32L31.6667 20H30V18H26V20H24.3333L24 18H20Z" fill="#125DE6"/>
    </g>
