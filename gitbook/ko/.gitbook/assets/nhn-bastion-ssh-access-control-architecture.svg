    <rect x="780" y="60" width="120" height="140" rx="8" fill="#FFFFFF"/>

    <!-- Instance A: 아이콘 center=(840, 88), 텍스트 y=110 -->
    <g transform="translate(826, 74) scale(0.7)">
      <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
    </g>
    <text x="840" y="110" text-anchor="middle" fill="#2D2D2D" font-size="10">Instance A</text>

    <!-- Instance B: 아이콘 center=(840, 132), 텍스트 y=154 -->
    <g transform="translate(826, 118) scale(0.7)">
      <path d="M32 22C33.1046 22 34 22.8954 34 24V32C34 33.1046 33.1046 34 32 34H8C6.89543 34 6 33.1046 6 32V24C6 22.8954 6.89543 22 8 22H32ZM22 30H30V26H22V30ZM32 6C33.1046 6 34 6.89543 34 8V16C34 17.1046 33.1046 18 32 18H8C6.89543 18 6 17.1046 6 16V8C6 6.89543 6.89543 6 8 6H32ZM22 14H30V10H22V14Z" fill="#125DE6"/>
    </g>
    <text x="840" y="154" text-anchor="middle" fill="#2D2D2D" font-size="10">Instance B</text>

    <text x="840" y="176" text-anchor="middle" fill="#8B8B8B" font-size="12">⋮</text>
    <text x="840" y="218" text-anchor="middle" fill="#2D2D2D" font-size="12" font-weight="600">대상 인스턴스</text>

    <!-- ===== 이력 관리 (하단, center x=480) ===== -->
    <rect x="370" y="260" width="220" height="110" rx="8" fill="#FFFFFF"/>
    <text x="480" y="286" text-anchor="middle" fill="#2D2D2D" font-size="12" font-weight="600">이력 관리</text>

    <rect x="390" y="298" width="80" height="24" rx="4" fill="#F7F7F7"/>
    <text x="430" y="314" text-anchor="middle" fill="#444444" font-size="10">접속 이력</text>

    <rect x="490" y="298" width="80" height="24" rx="4" fill="#F7F7F7"/>
    <text x="530" y="314" text-anchor="middle" fill="#444444" font-size="10">명령어 이력</text>

    <rect x="390" y="330" width="80" height="24" rx="4" fill="#F7F7F7"/>
    <text x="430" y="346" text-anchor="middle" fill="#444444" font-size="10">실시간 세션</text>

    <rect x="490" y="330" width="80" height="24" rx="4" fill="#F7F7F7"/>
    <text x="530" y="346" text-anchor="middle" fill="#444444" font-size="10">세션 차단</text>

    <!-- 웹 터미널 → 이력 관리 (화살표 x=480, 텍스트 바로 옆) -->
    <line x1="480" y1="194" x2="480" y2="258" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="492" y="232" fill="#444444" font-size="10">자동 기록</text>

    <!-- ===== 단계 번호 ===== -->
    <rect x="461" y="56" width="18" height="18" rx="9" fill="#2D2D2D"/>
    <text x="470" y="69" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1</text>
    <text x="486" y="69" fill="#444444" font-size="10">서비스 활성화 + 웹 터미널 생성</text>

    <rect x="790" y="30" width="18" height="18" rx="9" fill="#2D2D2D"/>
    <text x="799" y="43" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">2</text>
    <text x="814" y="43" fill="#444444" font-size="10">인스턴스 등록</text>

    <rect x="618" y="60" width="18" height="18" rx="9" fill="#2D2D2D"/>
    <text x="627" y="73" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">3</text>
    <text x="642" y="73" fill="#444444" font-size="10">정책 설정</text>

    <rect x="152" y="90" width="18" height="18" rx="9" fill="#2D2D2D"/>
    <text x="161" y="103" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">4</text>
    <text x="176" y="103" fill="#444444" font-size="10">SSH 접속</text>

    <rect x="451" y="384" width="18" height="18" rx="9" fill="#2D2D2D"/>
    <text x="460" y="397" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">5</text>
    <text x="475" y="397" fill="#444444" font-size="10">접속 이력 확인</text>
  </g>
</svg>
