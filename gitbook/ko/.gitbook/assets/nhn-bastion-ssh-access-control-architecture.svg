    <rect x="580" y="84" width="120" height="28" rx="6" fill="none" stroke="#125DE6" stroke-width="1.5"/>
    <text x="640" y="103" text-anchor="middle" fill="#125DE6" font-size="11" font-weight="600">접근 통제 정책</text>

    <rect x="580" y="128" width="120" height="28" rx="6" fill="none" stroke="#125DE6" stroke-width="1.5"/>
    <text x="640" y="147" text-anchor="middle" fill="#125DE6" font-size="11" font-weight="600">명령어 통제 정책</text>

    <line x1="516" y1="105" x2="578" y2="98" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="516" y1="135" x2="578" y2="142" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="702" y1="98" x2="778" y2="98" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="702" y1="142" x2="778" y2="142" stroke="#8B8B8B" stroke-width="1.5" marker-end="url(#arrow)"/>

