name: Poll and generate dashboard

on:
  schedule:
    # Weekdays 08:00 KST (23:00 UTC previous day)
    - cron: '0 23 * * 0-3'
    # Weekdays 14:00 KST (05:00 UTC)
    - cron: '0 5 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: self-hosted
    steps:
      - name: Verify tools in PATH
        shell: bash
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "git: $(git --version)"

      - uses: actions/checkout@v4

      - run: npm install
        shell: bash

      - run: npm run poll
        shell: bash
        env:
          GHE_TOKEN: ${{ secrets.GHE_TOKEN }}
          DOORAY_API_TOKEN: ${{ secrets.DOORAY_API_TOKEN }}
          DOORAY_WEBHOOK_URL: ${{ secrets.DOORAY_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated data and site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git add data/ docs/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update dashboard data [skip ci]"
          git checkout -- .
          git pull --rebase
          git push
