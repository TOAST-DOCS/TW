name: Poll and generate dashboard

on:
  schedule:
    # 두레이 태스크: 매일 09:00 KST (00:00 UTC)
    - cron: '0 0 * * 1-5'
    # GHE 변경 감지 + 배포 사항: 매월 4주차 수요일 12:00 KST (03:00 UTC, 22-28일 중 수요일)
    - cron: '0 3 22-28 * 3'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Poll mode (dooray / ghe / 빈 값 = 전체)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  poll:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - run: npm install

      - name: Determine poll mode
        id: mode
        run: |
          if ("${{ github.event.inputs.mode }}") {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "value=${{ github.event.inputs.mode }}`n")
          } elseif ("${{ github.event.schedule }}" -eq "0 0 * * 1-5") {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "value=dooray`n")
          } elseif ("${{ github.event.schedule }}" -eq "0 3 22-28 * 3") {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "value=ghe`n")
          } else {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "value=`n")
          }

      - name: Run poll
        run: node src/poll.js ${{ steps.mode.outputs.value }}
        env:
          GHE_TOKEN: ${{ secrets.GHE_TOKEN }}
          DOORAY_API_TOKEN: ${{ secrets.DOORAY_API_TOKEN }}
          DOORAY_WEBHOOK_URL: ${{ secrets.DOORAY_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false

          # 1. Check if poll produced any changes
          git add data/ docs/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes to commit"; exit 0 }

          # 2. Check if resolved.json was modified by poll (checkPrStatuses)
          git diff --cached --quiet -- data/resolved.json
          $resolvedChanged = ($LASTEXITCODE -ne 0)

          # 3. Save poll results to temp
          $tmp = Join-Path $env:RUNNER_TEMP "poll-output"
          New-Item "$tmp\data" -ItemType Directory -Force | Out-Null
          New-Item "$tmp\docs" -ItemType Directory -Force | Out-Null
          Copy-Item "data\*" "$tmp\data\" -Recurse -Force
          Copy-Item "docs\*" "$tmp\docs\" -Recurse -Force

          # 4. Reset to origin latest (preserves resolved.json from teammates)
          git fetch origin master
          git reset --hard origin/master

          # 5. Restore poll results (resolved.json excluded)
          Copy-Item "$tmp\data\*" "data\" -Recurse -Force -Exclude "resolved.json"
          Copy-Item "$tmp\docs\*" "docs\" -Recurse -Force

          # 6. Merge resolved.json if poll modified it (PR status updates only)
          if ($resolvedChanged) {
            node src/merge-resolved.js "$tmp\data\resolved.json" "data\resolved.json"
          }

          # 7. Commit and push
          git add data/ docs/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No effective changes"; exit 0 }
          git commit -m "chore: update dashboard data [skip ci]"
          git push
