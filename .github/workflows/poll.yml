name: Poll and generate dashboard

on:
  schedule:
    # Every day at 00:00 UTC = 09:00 KST
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run poll
        env:
          GHE_TOKEN: ${{ secrets.GHE_TOKEN }}
          DOORAY_API_TOKEN: ${{ secrets.DOORAY_API_TOKEN }}
          DOORAY_WEBHOOK_URL: ${{ secrets.DOORAY_WEBHOOK_URL }}

      - name: Commit updated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "chore: update dashboard data [skip ci]"
          git push
