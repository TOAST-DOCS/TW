name: Poll and generate dashboard

on:
  schedule:
    # 두레이 태스크: 매일 09:00 KST (00:00 UTC)
    - cron: '0 0 * * 1-5'
    # GHE 변경 감지 + 배포 사항: 매월 4주차 수요일 12:00 KST (03:00 UTC, 22-28일 중 수요일)
    - cron: '0 3 22-28 * 3'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Poll mode (dooray / ghe / 빈 값 = 전체)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  poll:
    runs-on: self-hosted
    steps:
      - name: Verify tools in PATH
        shell: bash
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "git: $(git --version)"

      - uses: actions/checkout@v4

      - run: npm install
        shell: bash

      - name: Determine poll mode
        id: mode
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "value=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ]; then
            echo "value=dooray" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 3 22-28 * 3" ]; then
            echo "value=ghe" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run poll
        shell: bash
        run: node src/poll.js ${{ steps.mode.outputs.value }}
        env:
          GHE_TOKEN: ${{ secrets.GHE_TOKEN }}
          DOORAY_API_TOKEN: ${{ secrets.DOORAY_API_TOKEN }}
          DOORAY_WEBHOOK_URL: ${{ secrets.DOORAY_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated data and site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git add data/ docs/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update dashboard data [skip ci]"
          git checkout -- .
          git pull --rebase
          git push
