<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#0F80F6"/>
</marker>
</defs>

<rect x="0" y="0" width="900" height="440" fill="#FFFFFF"/>

<text x="450" y="38" text-anchor="middle" font-family="Pretendard" font-size="20" font-weight="600" fill="#191919">번역을 처리하는 두 가지 구조</text>

<!-- Divider -->
<line x1="450" y1="70" x2="450" y2="410" stroke="#EBEBEB" stroke-width="1.5"/>
<circle cx="450" cy="240" r="16" fill="#FFFFFF" stroke="#EBEBEB" stroke-width="1.5"/>
<text x="450" y="245" text-anchor="middle" font-family="Pretendard" font-size="12" fill="#8B8B8B">vs</text>

<!-- LEFT: NMT -->
<text x="225" y="95" text-anchor="middle" font-family="Pretendard" font-size="16" font-weight="600" fill="#191919">기존 NMT(파파고 등)</text>
<text x="225" y="115" text-anchor="middle" font-family="Pretendard" font-size="12" fill="#8B8B8B">Encoder-Decoder 구조</text>

<rect x="150" y="135" width="150" height="46" rx="8" fill="#F7F7F7" stroke="#EBEBEB" stroke-width="1.5"/>
<text x="225" y="163" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#191919">원문</text>

<path d="M225,181 L225,205" stroke="#0F80F6" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>

<rect x="130" y="207" width="190" height="56" rx="8" fill="#E7F2FE" stroke="#58AAFF" stroke-width="1.5"/>
<text x="225" y="230" text-anchor="middle" font-family="Pretendard" font-size="13" font-weight="600" fill="#191919">Encoder</text>
<text x="225" y="250" text-anchor="middle" font-family="Pretendard" font-size="11" fill="#646464">원문을 벡터로 압축</text>

<path d="M225,263 L225,287" stroke="#0F80F6" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>

<rect x="130" y="289" width="190" height="56" rx="8" fill="#C7E3FF" stroke="#0F80F6" stroke-width="1.5"/>
<text x="225" y="312" text-anchor="middle" font-family="Pretendard" font-size="13" font-weight="600" fill="#191919">Decoder</text>
<text x="225" y="332" text-anchor="middle" font-family="Pretendard" font-size="11" fill="#646464">벡터를 보고 번역문 생성</text>

<path d="M225,345 L225,369" stroke="#0F80F6" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>

<rect x="150" y="371" width="150" height="46" rx="8" fill="#F7F7F7" stroke="#EBEBEB" stroke-width="1.5"/>
<text x="225" y="399" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#191919">번역문</text>

<text x="225" y="428" text-anchor="middle" font-family="Pretendard" font-size="11" fill="#8B8B8B">입력·출력을 별도 네트워크가 처리</text>

<!-- RIGHT: LLM -->
<text x="675" y="95" text-anchor="middle" font-family="Pretendard" font-size="16" font-weight="600" fill="#191919">LLM(클로드·GPT·제미나이)</text>
<text x="675" y="115" text-anchor="middle" font-family="Pretendard" font-size="12" fill="#8B8B8B">Decoder-Only 구조</text>

<rect x="560" y="140" width="230" height="76" rx="8" fill="#F7F7F7" stroke="#EBEBEB" stroke-width="1.5"/>
<text x="675" y="163" text-anchor="middle" font-family="Pretendard" font-size="12" fill="#191919">원문 + 번역 지시</text>
<text x="675" y="181" text-anchor="middle" font-family="Pretendard" font-size="12" fill="#191919">+ 지금까지 생성된 토큰</text>
<text x="675" y="200" text-anchor="middle" font-family="Pretendard" font-size="11" fill="#646464">— 하나의 연속된 문맥 —</text>

<path d="M675,216 L675,240" stroke="#0F80F6" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>

<rect x="540" y="242" width="270" height="66" rx="8" fill="#C7E3FF" stroke="#0F80F6" stroke-width="1.5"/>
<text x="675" y="268" text-anchor="middle" font-family="Pretendard" font-size="13" font-weight="600" fill="#191919">Decoder 스택</text>
<text x="675" y="288" text-anchor="middle" font-family="Pretendard" font-size="11" fill="#646464">Causal Self-Attention</text>

<path d="M675,308 L675,332" stroke="#0F80F6" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>

<rect x="590" y="334" width="170" height="50" rx="8" fill="#F7F7F7" stroke="#EBEBEB" stroke-width="1.5"/>
<text x="675" y="356" text-anchor="middle" font-family="Pretendard" font-size="12" fill="#191919">다음 토큰 생성</text>
<text x="675" y="374" text-anchor="middle" font-family="Pretendard" font-size="10" fill="#8B8B8B">(입력에 이어붙여 반복)</text>

<text x="675" y="418" text-anchor="middle" font-family="Pretendard" font-size="11" fill="#8B8B8B">입력·출력을 하나의 문맥으로 통합 처리</text>

</svg>
