<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#0F80F6"/>
</marker>
<marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#8B8B8B"/>
</marker>
</defs>

<rect x="0" y="0" width="900" height="520" fill="#FFFFFF"/>

<text x="450" y="42" text-anchor="middle" font-family="Pretendard" font-size="20" font-weight="600" fill="#191919">LLM은 이렇게 한 토큰씩 번역문을 만듭니다</text>
<text x="450" y="64" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#8B8B8B">(Decoder-Only 구조 기준)</text>

<!-- Step 1 -->
<rect x="40" y="90" width="200" height="86" rx="10" fill="#F7F7F7" stroke="#EBEBEB" stroke-width="1.5"/>
<text x="140" y="122" text-anchor="middle" font-family="Pretendard" font-size="15" font-weight="600" fill="#191919">① 입력</text>
<text x="140" y="146" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#646464">원문 + 지금까지</text>
<text x="140" y="164" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#646464">생성된 번역 토큰</text>

<!-- Step 2 -->
<rect x="350" y="90" width="200" height="86" rx="10" fill="#E7F2FE" stroke="#58AAFF" stroke-width="1.5"/>
<text x="450" y="118" text-anchor="middle" font-family="Pretendard" font-size="15" font-weight="600" fill="#191919">② 확률 계산</text>
<text x="450" y="142" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#646464">셀프 어텐션으로 모든</text>
<text x="450" y="160" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#646464">토큰 간 관계 계산</text>

<!-- Step 3 -->
<rect x="660" y="90" width="200" height="86" rx="10" fill="#F7F7F7" stroke="#EBEBEB" stroke-width="1.5"/>
<text x="760" y="122" text-anchor="middle" font-family="Pretendard" font-size="15" font-weight="600" fill="#191919">③ 토큰 선택</text>
<text x="760" y="146" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#646464">확률이 가장 높은</text>
<text x="760" y="164" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#646464">토큰 하나를 선택</text>

<!-- Step 4 -->
<rect x="350" y="260" width="200" height="86" rx="10" fill="#F7F7F7" stroke="#EBEBEB" stroke-width="1.5"/>
<text x="450" y="292" text-anchor="middle" font-family="Pretendard" font-size="15" font-weight="600" fill="#191919">④ 이어붙이기</text>
<text x="450" y="316" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#646464">선택한 토큰을</text>
<text x="450" y="334" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#646464">출력 뒤에 덧붙임</text>

<!-- Arrows: 1 -> 2 -> 3 -->
<path d="M240,133 L345,133" stroke="#0F80F6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M550,133 L655,133" stroke="#0F80F6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

<!-- 3 -> 4 (down and left) -->
<path d="M760,176 L760,303 L555,303" stroke="#0F80F6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

<!-- 4 -> 1 loop back (labeled 반복) -->
<path d="M350,303 L140,303 L140,176" stroke="#8B8B8B" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
<rect x="180" y="285" width="70" height="30" rx="6" fill="#FFFFFF" stroke="#8B8B8B" stroke-width="1"/>
<text x="215" y="305" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#646464">반복</text>

<!-- Exit branch from step 4 -->
<path d="M450,346 L450,420" stroke="#0F80F6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="470" y="388" text-anchor="start" font-family="Pretendard" font-size="12" fill="#646464">문장 종료 토큰이</text>
<text x="470" y="405" text-anchor="start" font-family="Pretendard" font-size="12" fill="#646464">나올 때까지 반복</text>

<!-- Final box -->
<rect x="350" y="430" width="200" height="70" rx="10" fill="#054283"/>
<text x="450" y="460" text-anchor="middle" font-family="Pretendard" font-size="15" font-weight="600" fill="#FFFFFF">번역 완료</text>
<text x="450" y="482" text-anchor="middle" font-family="Pretendard" font-size="12" fill="#C7E3FF">최종 번역문 출력</text>

</svg>
